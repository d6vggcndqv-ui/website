                    alt_baro: alt.onGround ? 'ground' : 0, gs: num(p.gs) ?? 0, lat: p.lat, lon: p.lon, geom_rate: rate,
                    track: (num(p.trk) != null && p.trk !== 0) ? p.trk : undefined   // the logger stores 0 when no track was sent; fall back to direction of movement
                });
                rows.push({ sec, alt, src, gs: num(p.gs) });
            }
            if (rows.length < 2) { removeTrack(tr); return null; }

            // [SMOOTH PATH] work out the smoothed height of every point; draw it if "Smoothed" is on
            const drawn = trailPoints(tr);
            if (drawn.length === rows.length) {
                drawn.forEach((pt, i) => trailNotePoint(pt, !rows[i].alt.onGround));
                const hundreds = pts.every(p => num(p.alt) == null || p.alt === cfg.fieldElevFt || p.alt % 100 === 0);   // this aircraft reports altitude in 100 ft steps
                trailSmooth(drawn, -Infinity, (hundreds ? SMOOTH_CAP_100_FT : SMOOTH_CAP_25_FT) * FT);
                if (histSmooth) trailApply(tr, drawn, true, -Infinity);
            }

            const first = rows[0], last = rows[rows.length - 1];
            const startMsReal = Math.round(first.sec * 1000), endMsReal = Math.round(last.sec * 1000);   // [FIRST OPEN] whole milliseconds
            const span = new Cesium.TimeIntervalCollection([new Cesium.TimeInterval({
                start: Cesium.JulianDate.fromDate(new Date(startMsReal)), stop: Cesium.JulianDate.fromDate(new Date(endMsReal)) })]);
            tr.entity.availability = span;   // the aircraft is only drawn during its recorded visit
            tr.drop.availability = span;

            applyIcon(tr, info);

            const rowAt = (time) => {   // latest recorded point at or before the replay time
                const s = histMsOf(time) / 1000 + 0.0005;   // [FIRST OPEN] exact time, so the first and last recorded points count
                let lo = 0, hi = rows.length - 1;
                if (s < first.sec || s > last.sec + 0.001) return null;
                while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (rows[mid].sec <= s) lo = mid; else hi = mid - 1; }
                return rows[lo];
            };
            tr.entity.model.heightReference = new Cesium.CallbackProperty(time => {
                const r = rowAt(time);
                return (r && r.alt.onGround) ? Cesium.HeightReference.CLAMP_TO_GROUND : Cesium.HeightReference.NONE;
            }, false);
            tr.entity.label.text = new Cesium.CallbackProperty(time => {
                const r = rowAt(time) || first;
                return `${reg}\n${r.alt.onGround ? 'GND' : Math.round(r.alt.mslFt).toLocaleString() + ' ft'}`;
            }, false);

            const source = gnss && !baro ? 'GNSS' : (gnss ? 'GNSS, pressure where missing' : (baro ? 'Pressure (not corrected)' : 'On ground only'));
            const fixed = [
                ['Registration', info.r || (/^N[0-9]/.test(reg) ? reg : '—')],
                ['Callsign', (storedOk && stored !== info.r) ? stored : '—'],
                ['ICAO hex', hex ? hex.toUpperCase() : '—'],
                ['Type', info.t || '—'],
                ['Recorded', `${histDay(startMsReal)}, ${histClock(startMsReal, true)} – ${histClock(endMsReal, true)}`],
                ['Lowest altitude', isFinite(lowest) ? `${Math.round(lowest).toLocaleString()} ft MSL` : 'On ground'],
                ['Altitude source', source]
            ];
            tr.entity.name = `${reg} · ${histClock(startMsReal)}`;
            tr.entity.description = new Cesium.CallbackProperty(time => {
                const r = rowAt(time);
                const now = r ? [
                    ['At replay time', histClock(r.sec * 1000, true)],
                    ['Altitude (MSL)', r.alt.onGround ? 'On ground' : `${Math.round(r.alt.mslFt).toLocaleString()} ft`],
                    ['Height above field', r.alt.onGround ? '0 ft' : `${Math.round(r.alt.mslFt - cfg.fieldElevFt).toLocaleString()} ft`],
                    ['Ground speed', r.gs != null ? `${Math.round(r.gs)} kt` : '—']
                ] : [];
                return '<table class="cesium-infoBox-defaultTable"><tbody>' +
                    fixed.concat(now).filter(([, v]) => v !== '—').map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('') + '</tbody></table>' +
                    (histSmooth ? SMOOTH_NOTE : '');   // [SMOOTH PATH]
            }, false);

            tr.hist = { startMs: startMsReal, endMs: endMsReal, reg };
            return tr;
        }

        // Track list in History: one entry per recorded visit, in time order
        function histRefreshList() {
            const sel = histEl('track-select');
            const items = Object.values(tracks).filter(t => t.hist).sort((a, b) => a.hist.startMs - b.hist.startMs);
            sel.innerHTML = '';
            const all = document.createElement('option');
            all.value = '';
            all.textContent = `All flights (${items.length})`;
            sel.appendChild(all);
            for (const t of items) {
                const o = document.createElement('option');
                o.value = t.hex;
                o.textContent = `${histClock(t.hist.startMs)} · ${t.hist.reg}`;
                sel.appendChild(o);
            }
            sel.value = focusHex || '';
            trackListKey = null;   // so the live list is rebuilt after switching back (null never matches, even with no aircraft)
        }

        function histFramePath(tr) {
            const pos = tr.segs.flatMap(s => s.pts.map(p => p.pos));
            if (pos.length < 2) return;
            viewer.camera.flyToBoundingSphere(Cesium.BoundingSphere.fromPoints(pos), {
                duration: 0, offset: new Cesium.HeadingPitchRange(Cesium.Math.toRadians(20), Cesium.Math.toRadians(-40), 0) });
        }

        // [FIRST OPEN] Put the view on the aircraft now, from the same spot the follow camera uses. Following only
        // starts once the aircraft's model has loaded; until then the view used to wait at the airport.
        function histLookAt(tr) {
            const now = viewer.clock.currentTime, p = tr.entity.position.getValue(now);
            if (!p) return;
            viewer.camera.lookAt(p, tr.entity.viewFrom.getValue(now));
            viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
        }

        // Follow the selected flight while its aircraft is on screen; leave the camera free otherwise.
        function histSyncFollow() {
            if (!historyOn || !histWin) return;
            const tr = focusHex ? tracks[focusHex] : null;
            if (focusHex !== histFocusSeen) {
                histFocusSeen = focusHex;
                if (tr && tr.hist && histClockMs() < tr.hist.startMs) histSetTime(tr.hist.startMs);   // not started yet: jump to where it appears
            }
            if (tr && tr.hist) {
                const ms = histClockMs(), onScreen = ms >= tr.hist.startMs && ms <= tr.hist.endMs;
                if (onScreen && viewer.trackedEntity !== tr.entity) viewer.trackedEntity = tr.entity;
                else if (!onScreen && viewer.trackedEntity) viewer.trackedEntity = undefined;
            }
        }

        // Draw a set of recorded visits and show the whole window at once
        function histShow(items, win, what, focusId, noneText, atStart) {
            clearTracks();
            items.sort((a, b) => String(a.d.timestamp).localeCompare(String(b.d.timestamp)));
            let shown = 0;
            for (const it of items.slice(0, HISTORY_MAX_FLIGHTS)) if (buildHistoryTrack(it.id, it.d)) shown++;

            histWin = win;
            const c = viewer.clock;
            c.startTime = Cesium.JulianDate.fromDate(new Date(win.startMs));
            c.stopTime = Cesium.JulianDate.fromDate(new Date(win.endMs));
            c.clockRange = Cesium.ClockRange.CLAMPED;
            histEl('tl-slider').max = Math.max(1, Math.round((win.endMs - win.startMs) / 1000));
            histEl('hist-timeline').style.display = shown ? 'flex' : 'none';
            histPlay(false);
            histSetTime(win.endMs);   // all paths at once
            histFocusSeen = null;
            histRefreshList();

            const range = `${histDay(win.startMs)}, ${histClock(win.startMs)} – ${histClock(win.endMs)}`;
            if (!shown) {
                const old = Date.now() - win.endMs > HISTORY_KEPT_DAYS * 86400000;
                setStatus(`History · ${noneText || 'no recorded flights · ' + range}` + (old ? ` (tracks are kept for ${HISTORY_KEPT_DAYS} days)` : ''));
            } else {
                setStatus(`History · ${shown} flight${shown === 1 ? '' : 's'} · ${what || ''}${range}` +
                    (items.length > shown ? ` · showing the first ${shown} of ${items.length}; choose a shorter length` : ''));
            }
            if (focusId && tracks[focusId]) {
                setFocus(focusId);
                if (atStart) histSetTime(tracks[focusId].hist.startMs);   // a link to one track opens at the start of that track
                histSyncFollow();
                if (!viewer.trackedEntity) histFramePath(tracks[focusId]);
                else if (atStart) histLookAt(tracks[focusId]);   // [FIRST OPEN]
            }
        }

        // [FIRST OPEN] Add more recorded visits to what is showing, without moving the clock, the view or the selection
        function histAddFlights(items, note) {
            items.sort((a, b) => String(a.d.timestamp).localeCompare(String(b.d.timestamp)));
            const count = () => Object.values(tracks).filter(t => t.hist).length;
            let room = HISTORY_MAX_FLIGHTS - count();
            for (const it of items) {
                if (tracks[it.id]) continue;
                if (room <= 0) break;
                if (buildHistoryTrack(it.id, it.d)) room--;
            }
            histRefreshList();
            const shown = count();
            setStatus(`History · ${shown} flight${shown === 1 ? '' : 's'} · ${histDay(histWin.startMs)}, ${histClock(histWin.startMs)} – ${histClock(histWin.endMs)}${note || ''}`);
        }

        async function histRun(job) {
            const src = histSource();
            if (!src) { setStatus('History is not set up for this airport yet.', true); return; }
            const gen = ++histLoadGen;
            setStatus('History · loading…');
            try {
                const out = await job(src);
                if (gen !== histLoadGen || !historyOn || !out) return;
                histShow(out.items, out.win, out.what, out.focusId, out.noneText, out.atStart);
            } catch (err) {
                console.error('[3D] history load failed:', err);
                if (gen === histLoadGen) setStatus(`History could not be loaded (${err.code || err.message || 'error'})`, true);
            }
        }

        // Every visit overlapping [startMs, endMs]
        function histLoadWindow(startMs, endMs, focusId) {
            return histRun(async (src) => {
                const from = new Date(startMs - HISTORY_LOOKBACK_MIN * 60000).toISOString(), to = new Date(endMs).toISOString();
                const snap = await getDocs(query(collection(db, src.collection), where('timestamp', '>=', from), where('timestamp', '<=', to)));
                const items = snap.docs.map(s => ({ id: s.id, d: s.data() }))
                    .filter(x => (Date.parse(x.d.end) || Date.parse(x.d.timestamp)) >= startMs);
                return { items, win: { startMs, endMs }, focusId };
            });
        }

        // One tail number's visits on one airport-local date
        function histLoadTail(date, tail) {
            return histRun(async (src) => {
                const snap = await getDocs(query(collection(db, src.collection),
                    where('date', '==', `${pad2(date.mo)}/${pad2(date.d)}/${date.y}`), where('registration', '==', tail)));
                const items = snap.docs.map(s => ({ id: s.id, d: s.data() }));
                const dayStart = zonedToUtcMs(date.y, date.mo, date.d, 0, 0, src.tz);
                let startMs = dayStart, endMs = dayStart + 86400000;
                if (items.length) {
                    startMs = Math.min(...items.map(x => Date.parse(x.d.start || x.d.timestamp))) - 30000;
                    endMs = Math.max(...items.map(x => Date.parse(x.d.end) || Date.parse(x.d.timestamp))) + 30000;
                }
                return { items, win: { startMs, endMs }, what: `${tail} · `, noneText: `no recorded flights for ${tail} on ${histDay(dayStart + 43200000)}` };
            });
        }

        // One recorded visit by its document id, with the 30 minutes around it
        function histLoadTrack(id) {
            return histRun(async (src) => {
                const gen = histLoadGen;   // [FIRST OPEN]
                let snap = null;
                if (histEarly && histEarly.id === id && histEarly.collection === src.collection) snap = await histEarly.promise.catch(() => null);   // [FIRST OPEN] already asked for at page load
                if (!snap) snap = await getDoc(doc(db, src.collection, id));
                if (!snap.exists()) { setStatus('History · that recorded flight was not found (it may be older than the tracks that are kept)', true); return null; }
                const d = snap.data(), s = Date.parse(d.start || d.timestamp), e = Date.parse(d.end) || s;
                const pad = Math.max(0, (30 * 60000 - (e - s)) / 2);
                const startMs = Math.floor((s - pad) / 60000) * 60000, endMs = Math.ceil((e + pad) / 60000) * 60000;
                const p = tzParts(startMs, src.tz);
                histEl('hist-date').value = `${p.y}-${pad2(p.mo)}-${pad2(p.d)}`;
                histEl('hist-time').value = `${pad2(p.h)}:${pad2(p.mi)}`;
                const from = new Date(startMs - HISTORY_LOOKBACK_MIN * 60000).toISOString(), to = new Date(endMs).toISOString();
                // [FIRST OPEN] show this flight as soon as its own record arrives, at the start of its track.
                // The other flights around it take longer to fetch and are added when they arrive.
                if (gen !== histLoadGen || !historyOn) return null;
                histShow([{ id, d }], { startMs, endMs }, '', id, null, true);
                const mine = tracks[id];
                if (mine) setStatus(`History · ${mine.hist.reg} · ${histDay(startMs)}, ${histClock(startMs)} – ${histClock(endMs)} · adding nearby flights…`);
                let items = [], note = '';
                try {
                    const near = await getDocs(query(collection(db, src.collection), where('timestamp', '>=', from), where('timestamp', '<=', to)));
                    items = near.docs.map(x => ({ id: x.id, d: x.data() })).filter(x => (Date.parse(x.d.end) || Date.parse(x.d.timestamp)) >= startMs);
                } catch (err) {
                    console.error('[3D] nearby flights failed:', err);
                    note = ' · nearby flights could not be loaded';
                }
                if (gen !== histLoadGen || !historyOn) return null;
                if (mine) { histAddFlights(items, note); return null; }   // already showing: just add the others
                if (!items.some(x => x.id === id)) items.push({ id, d });
                return { items, win: { startMs, endMs }, focusId: id, atStart: true };
            });
        }

        function histLoadFromPanel() {
            const src = histSource();
            const date = parseDateText(histEl('hist-date').value), time = parseTimeText(histEl('hist-time').value);
            if (!src || !date || !time) { setStatus('History · choose a date and a start time first', true); return; }
            const startMs = zonedToUtcMs(date.y, date.mo, date.d, time.h, time.mi, src.tz);
            histLoadWindow(startMs, startMs + Number(histEl('hist-window').value) * 60000);
        }
        function histFindTail() {
            const date = parseDateText(histEl('hist-date').value);
            let tail = histEl('hist-tail').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (/^\d/.test(tail)) tail = 'N' + tail;
            histEl('hist-tail').value = tail;
            if (!date || !tail) { setStatus('History · choose a date and type a tail number first', true); return; }
            histLoadTail(date, tail);
        }

        function enterHistory(autoLoad) {
            if (!cfg || !viewer) return;
            if (!historyOn) {
                historyOn = true;
                backfillCount++;   // holds the live feed: poll() waits while backfillCount is above zero
                viewer.allowDataSourcesToSuspendAnimation = false;   // keep replay speed steady while models and trails load
            }
            pollGen++;             // drop any live update still on its way
            histLoadGen++;
            clearTracks();
            histWin = null;
            histPlay(false);
            histEl('mode-live').classList.remove('mode-on');
            histEl('mode-history').classList.add('mode-on');
            histEl('a3d-history').style.display = 'flex';
            histEl('main-content').classList.add('hist-on');
            histEl('hist-timeline').style.display = 'none';
            histRefreshList();
            setStatus('History · choose a date and time, then press "Show flights"');

            const src = histSource();
            if (src && !histEl('hist-date').value) {   // start with the most recent hour
                const p = tzParts(Math.floor((Date.now() - 3600000) / 300000) * 300000, src.tz);
                histEl('hist-date').value = `${p.y}-${pad2(p.mo)}-${pad2(p.d)}`;
                histEl('hist-time').value = `${pad2(p.h)}:${pad2(p.mi)}`;
            }
            if (autoLoad) histLoadFromPanel();
        }

        function exitHistory() {
            if (!historyOn) return;
            historyOn = false;
            backfillCount--;
            viewer.allowDataSourcesToSuspendAnimation = true;
            histLoadGen++;
            histWin = null;
            histPlaying = false;
            const c = viewer.clock;
            c.clockRange = Cesium.ClockRange.UNBOUNDED;
            c.multiplier = 1;
            c.shouldAnimate = true;
            c.currentTime = Cesium.JulianDate.fromDate(new Date(Date.now() - DISPLAY_DELAY_S * 1000));
            histEl('mode-history').classList.remove('mode-on');
            histEl('mode-live').classList.add('mode-on');
            histEl('a3d-history').style.display = 'none';
            histEl('main-content').classList.remove('hist-on');
            histEl('hist-timeline').style.display = 'none';
            trackListKey = null;
            const code = currentAirportCode();
            if (code) startAirport(code);   // restarts the live view
            refreshTrackList();             // show the live list straight away, even when no aircraft are in view
        }

        function initHistory() {
            if (historyReady) return;
            historyReady = true;

            // timeline row, placed inside the view-button bar above the buttons
            const tl = document.createElement('div');
            tl.id = 'hist-timeline';
            tl.innerHTML =
                '<button type="button" id="tl-replay" class="vb-btn vb-wide" title="Go back to the start and play">Replay</button>' +
                '<button type="button" id="tl-play" class="vb-btn vb-wide" title="Play or pause the replay">Play</button>' +
                '<input type="range" id="tl-slider" min="0" max="3600" step="1" value="0" aria-label="Replay time">' +
                '<span id="tl-time"></span>' +
                '<select id="tl-speed" aria-label="Replay speed" title="Replay speed">' +
                    HISTORY_SPEEDS.map(s => `<option value="${s}"${s === HISTORY_DEFAULT_SPEED ? ' selected' : ''}>${s}× speed</option>`).join('') + '</select>' +
                '<button type="button" id="tl-all" class="vb-btn vb-wide" title="Show the whole of every path in this time window at once">Show full paths</button>';
            histEl('a3d-viewbar').appendChild(tl);

            histEl('mode-live').addEventListener('click', exitHistory);
            histEl('mode-history').addEventListener('click', () => { if (!historyOn) enterHistory(true); });
            histEl('hist-load').addEventListener('click', histLoadFromPanel);
            histEl('hist-find').addEventListener('click', histFindTail);
            histEl('hist-tail').addEventListener('keydown', e => { if (e.key === 'Enter') histFindTail(); });

            histEl('tl-play').addEventListener('click', () => {
                if (!histWin) return;
                if (!histPlaying && histClockMs() >= histWin.endMs) {   // at the end: start over
                    const tr = focusHex ? tracks[focusHex] : null;
                    histSetTime(tr && tr.hist ? tr.hist.startMs : histWin.startMs);
                }
                histPlay(!histPlaying);
            });
            histEl('tl-replay').addEventListener('click', () => {
                if (!histWin) return;
                const tr = focusHex ? tracks[focusHex] : null;
                histSetTime(tr && tr.hist ? tr.hist.startMs : histWin.startMs);   // the selected flight's start, or the start of the window
                histPlay(true);
            });
            histEl('tl-all').addEventListener('click', () => { if (histWin) { histPlay(false); histSetTime(histWin.endMs); } });
            histEl('tl-speed').addEventListener('change', e => { histSpeed = Number(e.target.value) || 1; viewer.clock.multiplier = histSpeed; });
            const slider = histEl('tl-slider');
            slider.addEventListener('input', () => { histDragging = true; if (histWin) histSetTime(histWin.startMs + Number(slider.value) * 1000); });
            for (const ev of ['change', 'pointerup', 'blur']) slider.addEventListener(ev, () => { histDragging = false; });

            // these run after the existing handlers, so the selection has already been applied
            histEl('track-select').addEventListener('change', () => {
                if (!historyOn) return;
                histSyncFollow();
                const tr = focusHex ? tracks[focusHex] : null;
                if (tr && tr.hist && !viewer.trackedEntity) histFramePath(tr);   // picked from the list and not on screen: bring its path into view
            });
            viewer.selectedEntityChanged.addEventListener(() => histSyncFollow());
            histEl('airport-select').addEventListener('change', () => {
                if (!historyOn) return;        // the live view for the new airport has just been started; replace it with History
                pollGen++;
                clearTracks();
                histWin = null;
                histEl('hist-timeline').style.display = 'none';
                histRefreshList();
                histLoadFromPanel();
            });

            viewer.clock.onTick.addEventListener(() => {
                if (!historyOn || !histWin) return;
                const ms = histClockMs();
                if (histPlaying && ms >= histWin.endMs) histPlay(false);
                if (!histDragging) slider.value = Math.round((ms - histWin.startMs) / 1000);
                histEl('tl-time').textContent = histClock(ms, true);
                histSyncFollow();
            });

            // view-button bar wording and Move buttons while in History
            viewer.scene.preRender.addEventListener(() => {
                const stopBtn = histEl('vb-stop'), want = historyOn ? 'Show all flights' : 'Stop following';
                if (stopBtn && stopBtn.textContent !== want) stopBtn.textContent = want;
                if (historyOn) {
                    const locked = !!viewer.trackedEntity;   // Move is only off while the camera is actually following
                    document.querySelectorAll('#vb-move .vb-btn').forEach(b => { if (b.disabled !== locked) b.disabled = locked; });
                }
            });

            // links from other pages
            const qp = new URLSearchParams(location.search);
            const wantAirport = (qp.get('airport') || '').toLowerCase();
            const isAdmin = histEl('airport-selector').style.display === 'flex';
            if (isAdmin && AIRPORT_3D[wantAirport] && wantAirport !== currentAirportCode()) {
                histEl('airport-select').value = wantAirport;
                startAirport(wantAirport);
            }
            const date = parseDateText(qp.get('date')), time = parseTimeText(qp.get('time'));
            if (qp.get('track')) {
                enterHistory(false);
                histLoadTrack(qp.get('track'));
            } else if (date) {
                enterHistory(false);
                histEl('hist-date').value = `${date.y}-${pad2(date.mo)}-${pad2(date.d)}`;
                if (time) histEl('hist-time').value = `${pad2(time.h)}:${pad2(time.mi)}`;
                const len = String(parseInt(qp.get('window'), 10));
                if ([...histEl('hist-window').options].some(o => o.value === len)) histEl('hist-window').value = len;
                if (qp.get('tail')) { histEl('hist-tail').value = qp.get('tail'); histFindTail(); }
                else if (time) histLoadFromPanel();
            }
        }

        // ════════════════════════════════════════════════════════════════
        // [TRAIL STYLE] Curtain under each path: light shading from the path straight
        // down to the ground, in the same altitude colour, strongest at the path and
        // fading toward the ground.
        //    Live: every path that is showing. History: the selected flight only.
        // Nothing in the existing track code is changed, and the path lines themselves
        // are untouched: once a frame this looks at the paths that exist and adds,
        // updates or removes its own drawing to match.
        // The curtain cannot be clicked, so clicks pass through to whatever is behind it.
        // ════════════════════════════════════════════════════════════════
        const CURTAIN_ALPHA_TOP = 0.34;     // curtain opacity at the path
        const CURTAIN_ALPHA_GROUND = 0.06;  // curtain opacity at the ground

        let trailStyleReady = false, curtainLayer = null, curtainLook = null;
        let curtainEpoch = 0, curtainFrame = 0;
        const curtainRecs = new Set();      // curtain pieces currently on screen
        const curtainCarto = new Cesium.Cartographic(), curtainHead = new Cesium.Cartesian3();

        // Ground height (m above the ellipsoid) under a longitude / latitude in radians, read from the same
        // elevation tiles the terrain is built from, at a fixed zoom. Returns undefined until that tile has arrived.
        const CURTAIN_TERRAIN_Z = 12;       // about 30 m per sample here; these tiles are normally already loaded for the view
        const curtainTiles = new Map();     // "x/y" -> decoded tile, null if unavailable, undefined while loading
        function curtainGroundM(lon, lat) {
            const n = 1 << CURTAIN_TERRAIN_Z;
            const xf = (lon + Math.PI) / (2 * Math.PI) * n;
            const yf = (1 - Math.log(Math.tan(lat) + 1 / Math.cos(lat)) / Math.PI) / 2 * n;
            const x = Math.floor(xf), y = Math.floor(yf), key = x + '/' + y;
            if (!curtainTiles.has(key)) {
                curtainTiles.set(key, undefined);
                loadTerrarium(CURTAIN_TERRAIN_Z, x, y).then(t => { curtainTiles.set(key, t); curtainEpoch++; });   // curtains waiting on it are re-seated
                return undefined;
            }
            const t = curtainTiles.get(key);
            if (!t) return undefined;
            const S = t.size, H = t.h;
            const fx = Math.min(Math.max((xf - x) * S - 0.5, 0), S - 1), fy = Math.min(Math.max((yf - y) * S - 0.5, 0), S - 1);
            const x0 = Math.floor(fx), x1 = Math.min(x0 + 1, S - 1), y0 = Math.floor(fy), y1 = Math.min(y0 + 1, S - 1), tx = fx - x0, ty = fy - y0;
            return (H[y0 * S + x0] * (1 - tx) + H[y0 * S + x1] * tx) * (1 - ty) + (H[y1 * S + x0] * (1 - tx) + H[y1 * S + x1] * tx) * ty + cfg.geoidFt * FT;
        }

        // The point on the ground straight below a path point. `cache` (the path point itself) remembers the answer.
        // Until the elevation tile arrives the field elevation is used, and `note.waiting` is set so the strip is redone later.
        function curtainFoot(pos, cache, note) {
            if (cache && cache.gOk) return cache.gPos;
            const c = Cesium.Cartographic.fromCartesian(pos, undefined, curtainCarto);
            if (!c) return pos;
            let groundM = curtainGroundM(c.longitude, c.latitude);
            const known = groundM !== undefined;
            if (!known) { groundM = (cfg.fieldElevFt + cfg.geoidFt) * FT; if (note) note.waiting = true; }
            const foot = (c.height - groundM >= 3) ? Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, groundM) : pos;   // on the ground: no curtain
            if (cache && known) { cache.gOk = true; cache.gPos = foot; }
            return foot;
        }

        // One strip of curtain under a run of path points
        function curtainStrip(tops, feet, color) {
            const n = tops.length;
            if (n < 2) return null;
            const pos = new Float64Array(n * 6), col = new Uint8Array(n * 8), idx = new Uint16Array((n - 1) * 6);
            const r = Math.round(color.red * 255), g = Math.round(color.green * 255), b = Math.round(color.blue * 255);
            for (let i = 0; i < n; i++) {
                const t = tops[i], f = feet[i];
                pos.set([t.x, t.y, t.z, f.x, f.y, f.z], i * 6);
                col.set([r, g, b, Math.round(CURTAIN_ALPHA_TOP * 255), r, g, b, Math.round(CURTAIN_ALPHA_GROUND * 255)], i * 8);
                if (i < n - 1) idx.set([2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 2, 2 * i + 1, 2 * i + 3], i * 6);
            }
            return new Cesium.Primitive({
                geometryInstances: new Cesium.GeometryInstance({
                    geometry: new Cesium.Geometry({
                        attributes: {
                            position: new Cesium.GeometryAttribute({ componentDatatype: Cesium.ComponentDatatype.DOUBLE, componentsPerAttribute: 3, values: pos }),
                            color: new Cesium.GeometryAttribute({ componentDatatype: Cesium.ComponentDatatype.UNSIGNED_BYTE, componentsPerAttribute: 4, normalize: true, values: col })
                        },
                        indices: idx,
                        primitiveType: Cesium.PrimitiveType.TRIANGLES,
                        boundingSphere: Cesium.BoundingSphere.fromVertices(pos)
                    })
                }),
                appearance: curtainLook,
                asynchronous: false,   // ready in the same frame, so a rebuilt strip never blinks
                allowPicking: false
            });
        }

        // Keep one curtain piece up to date: rebuilt only when what it covers has changed
        // (or, while it is waiting for an elevation tile, when one arrives)
        function curtainKeep(rec, key, build) {
            rec.seen = curtainFrame;
            if (rec.key === key && (!rec.waiting || rec.epoch === curtainEpoch)) return;
            rec.waiting = false;
            const next = build(rec);
            if (rec.prim) curtainLayer.remove(rec.prim);
            rec.prim = next ? curtainLayer.add(next) : null;
            rec.key = key;
            rec.epoch = curtainEpoch;
            curtainRecs.add(rec);
        }

        function updateTrailStyle() {
            const time = viewer.clock.currentTime;
            const nowSec = Cesium.JulianDate.toDate(time).getTime() / 1000;   // the same reading the paths use
            curtainFrame++;
            for (const hex in tracks) {
                const tr = tracks[hex];
                if (historyOn && focusHex !== hex) continue;   // History: curtain for the selected flight only
                const lastSeg = tr.segs[tr.segs.length - 1];
                for (const seg of tr.segs) {
                    if (!seg.entity.show) continue;   // path hidden (another aircraft is selected)
                    const pts = seg.pts;
                    let n = 0;
                    while (n < pts.length && pts[n].sec <= nowSec) n++;   // points drawn so far
                    if (n >= 2) {
                        curtainKeep(seg.fxCurtain || (seg.fxCurtain = {}), `${n}|${pts[0].sec}`, (rec) => {
                            const tops = [], feet = [];
                            for (let i = 0; i < n; i++) { tops.push(pts[i].pos); feet.push(curtainFoot(pts[i].pos, pts[i], rec)); }
                            return curtainStrip(tops, feet, BAND_COLORS[seg.band]);
                        });
                    }
                    if (seg === lastSeg && n >= 1) {   // from the newest point to where the aircraft is right now
                        const head = tr.samples.getValue(time, curtainHead), tail = pts[n - 1];
                        if (head && Cesium.Cartesian3.distanceSquared(head, tail.pos) > 1) {
                            curtainKeep(tr.fxCurtainTip || (tr.fxCurtainTip = {}), `${tail.sec}|${head.x.toFixed(1)}|${head.y.toFixed(1)}|${head.z.toFixed(1)}`, (rec) =>
                                curtainStrip([tail.pos, Cesium.Cartesian3.clone(head)], [curtainFoot(tail.pos, tail, rec), curtainFoot(head, null, rec)], BAND_COLORS[seg.band]));
                        }
                    }
                }
            }
            for (const rec of curtainRecs) {   // pieces whose path is gone, hidden or no longer selected
                if (rec.seen === curtainFrame) continue;
                if (rec.prim) curtainLayer.remove(rec.prim);
                rec.prim = null;
                rec.key = null;
                rec.waiting = false;
                curtainRecs.delete(rec);
            }
        }

        function initTrailStyle() {
            if (trailStyleReady) return;
            trailStyleReady = true;
            curtainLayer = viewer.scene.primitives.add(new Cesium.PrimitiveCollection());
            curtainLook = new Cesium.PerInstanceColorAppearance({ flat: true, translucent: true, closed: false });
            viewer.scene.preUpdate.addEventListener(updateTrailStyle);
        }

        // ════════════════════════════════════════════════════════════════
        // [SMOOTH PATH] Draws each path at a smoothed height.
        // Aircraft report altitude in steps (25 ft, or 100 ft with older encoders), so a
        // steady climb or descent arrives as a staircase. This evens the steps out.
        //  • Only the height that is DRAWN changes: path, curtain and aircraft model.
        //    Position over the ground, time, and everything stored are untouched.
        //  • Each airborne point is averaged with its neighbours up to SMOOTH_HALF_S
        //    seconds either side (nearer ones count more). The reach is always the same
        //    on both sides, so a steady climb is not shifted and the ends of a path stay
        //    exactly where they were recorded.
        //  • Cap: a point is never drawn more than half a reporting step from its
        //    recorded height (50 ft for 100 ft reporting, 12.5 ft for 25 ft).
        //  • Points on the ground are left alone, and points either side of a gap in
        //    coverage are not blended together.
        //  • Altitude colours, labels and info-panel figures still use recorded values.
        //  • History has a Smoothed / Recorded switch. Live is always smoothed; there the
        //    newest few seconds of a path settle as the following reports arrive.
        // ════════════════════════════════════════════════════════════════
        const SMOOTH_HALF_S = 8;          // how far either side of a point the average reaches (seconds)
        const SMOOTH_CAP_100_FT = 50;     // most a point may move when the aircraft reports in 100 ft steps
        const SMOOTH_CAP_25_FT = 12.5;    // ... and when it reports in 25 ft steps
        const SMOOTH_NOTE = '<div style="padding:5px 6px 2px;font-size:11px;line-height:1.35;color:#b8c4c4;">Path drawn smoothed; figures are as recorded.</div>';
        let histSmooth = true;            // History: true = Smoothed, false = Recorded
        let smoothReady = false;
        const smoothCarto = new Cesium.Cartographic();

        // Every point of a path once, in time order
        function trailPoints(tr) {
            const out = [];
            let prev = null;
            for (const seg of tr.segs) for (const pt of seg.pts) { if (pt !== prev) out.push(pt); prev = pt; }
            return out;
        }

        // Remember a point as recorded. `air` says whether it is airborne; when not given (live paths)
        // it is worked out from the height, because points on the ground are always placed at field elevation.
        function trailNotePoint(pt, air) {
            const c = Cesium.Cartographic.fromCartesian(pt.pos, undefined, smoothCarto);
            pt.posRec = pt.pos;
            pt.posSm = pt.pos;
            pt.lonR = c.longitude;
            pt.latR = c.latitude;
            pt.hRec = c.height;
            pt.air = air !== undefined ? air : Math.abs(c.height - ((cfg.fieldElevFt + cfg.geoidFt) * FT + GROUND_LIFT_M)) > 0.05;
        }

        // Smoothed position for every point at or after fromSec. capM = most a point may move (metres).
        function trailSmooth(P, fromSec, capM) {
            const n = P.length;
            let a = 0;
            while (a < n) {
                if (!P[a].air) { a++; continue; }
                let b = a;   // a..b = one unbroken airborne stretch
                while (b + 1 < n && P[b + 1].air && P[b + 1].sec - P[b].sec <= GAP_BREAK_S) b++;
                for (let i = a; i <= b; i++) {
                    const pt = P[i];
                    if (pt.sec < fromSec) continue;
                    const reach = Math.min(SMOOTH_HALF_S, pt.sec - P[a].sec, P[b].sec - pt.sec);   // same reach both sides
                    let sum = pt.hRec, weight = 1;
                    for (let j = i - 1; j >= a && pt.sec - P[j].sec < reach; j--) { const w = 1 - (pt.sec - P[j].sec) / reach; sum += w * P[j].hRec; weight += w; }
                    for (let j = i + 1; j <= b && P[j].sec - pt.sec < reach; j++) { const w = 1 - (P[j].sec - pt.sec) / reach; sum += w * P[j].hRec; weight += w; }
                    const h = Math.min(pt.hRec + capM, Math.max(pt.hRec - capM, sum / weight));
                    pt.posSm = Math.abs(h - pt.hRec) < 0.02 ? pt.posRec : Cesium.Cartesian3.fromRadians(pt.lonR, pt.latR, h);
                }
                a = b + 1;
            }
        }

        // Draw a path (and move its aircraft) at the smoothed or the recorded heights
        function trailApply(tr, P, smoothed, fromSec) {
            for (const pt of P) {
                if (pt.sec < fromSec || !pt.posRec) continue;
                const pos = smoothed ? pt.posSm : pt.posRec;
                if (pos === pt.pos) continue;
                pt.pos = pos;
                tr.samples.addSample(Cesium.JulianDate.fromDate(new Date(pt.sec * 1000)), pos);   // same time as before, so it replaces the old height
            }
        }

        // Live: called for every report. Notes whether this aircraft reports altitude in 100 ft steps,
        // and adds the note to its info panel.
        function trailNoteReport(tr, ac) {
            if (typeof ac.alt_baro === 'number') {
                tr.fxBaroN = (tr.fxBaroN || 0) + 1;
                if (ac.alt_baro % 100 !== 0) tr.fxBaroFine = true;
            }
            const d = tr.entity.description && tr.entity.description.getValue(viewer.clock.currentTime);
            if (typeof d === 'string' && !d.endsWith(SMOOTH_NOTE)) tr.entity.description = d + SMOOTH_NOTE;
        }

        // Live: once a frame, smooth the part of each path that new reports have changed
        function updateLiveSmoothing() {
            for (const hex in tracks) {
                const tr = tracks[hex];
                if (tr.hist) continue;   // recorded visits are prepared when they are built
                const capFt = (tr.fxBaroN >= 4 && !tr.fxBaroFine) ? SMOOTH_CAP_100_FT : SMOOTH_CAP_25_FT;
                if (tr.last === tr.fxSmLast && capFt === tr.fxCapFt) continue;   // nothing new
                const P = trailPoints(tr);
                let fromSec = capFt === tr.fxCapFt ? Infinity : -Infinity;      // reporting step just became known: redo the whole path
                for (const pt of P) {
                    if (pt.posRec) continue;
                    trailNotePoint(pt);
                    fromSec = Math.min(fromSec, pt.sec - SMOOTH_HALF_S - GAP_BREAK_S);   // earlier points whose average can now reach further
                }
                tr.fxSmLast = tr.last;
                tr.fxCapFt = capFt;
                if (fromSec === Infinity) continue;
                trailSmooth(P, fromSec, capFt * FT);
                trailApply(tr, P, true, fromSec);
            }
        }

        // History: the Smoothed / Recorded switch. Keeps the time, the selection and the view as they are.
        function histSetSmooth(on) {
            histSmooth = !!on;
            document.getElementById('path-smooth').classList.toggle('path-on', histSmooth);
            document.getElementById('path-recorded').classList.toggle('path-on', !histSmooth);
            for (const id in tracks) {
                const tr = tracks[id];
                if (tr.hist) trailApply(tr, trailPoints(tr), histSmooth, -Infinity);
            }
            for (const rec of curtainRecs) rec.key = null;   // redraw the curtain to match
        }

        function initSmoothPath() {
            if (smoothReady) return;
            smoothReady = true;
            document.getElementById('path-smooth').addEventListener('click', () => histSetSmooth(true));
            document.getElementById('path-recorded').addEventListener('click', () => histSetSmooth(false));
            viewer.scene.preUpdate.addEventListener(updateLiveSmoothing);
        }

        // ════════════════════════════════════════════════════════════════
        // [REPORT PIN] Marks a report address passed in from Noise Abatement.
        //  The "View in 3D" link adds  pin=<lat>,<lon>  pin-label=<address>  pin-radius=<miles>.
        //  This draws a purple pin on the ground at the address with the address above
        //  it, and the same search radius as a dashed ring on the ground. It shows in
        //  History only. Without those link values nothing is drawn. Like the paths,
        //  the pin and ring are not hidden behind hills.
        //  Clicking the pin works like clicking empty space (back to all flights).
        // ════════════════════════════════════════════════════════════════
        const REPORT_COLOR = '#7c3aed';
        const REPORT_PIN_ICON = 'data:image/svg+xml;utf8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="' + REPORT_COLOR + '" stroke="#ffffff" stroke-width="3"/></svg>');
        let reportPinReady = false;
        function initReportPin() {
            if (reportPinReady) return;
            reportPinReady = true;
            const qp = new URLSearchParams(location.search);
            const ll = (qp.get('pin') || '').split(',').map(Number);
            if (ll.length !== 2 || !ll.every(isFinite) || Math.abs(ll[0]) > 90 || Math.abs(ll[1]) > 180) return;
            const [lat, lon] = ll;
            let label = (qp.get('pin-label') || 'Report location').trim().slice(0, 200);
            if (label.length > 48) label = label.slice(0, 47) + '…';
            const radiusMi = Number(qp.get('pin-radius'));
            const color = Cesium.Color.fromCssColorString(REPORT_COLOR);
            // Heights come from the same elevation tiles as the curtain ([TRAIL STYLE]), so the pin and ring sit on
            // the ground whatever detail the map has loaded so far. Field elevation is used until a tile arrives.
            const k = Math.PI / 180;
            const ring = [];
            if (radiusMi > 0 && radiusMi <= 10) {   // the radius searched on Noise Abatement
                const r = radiusMi * 1609.344;
                for (let i = 0; i <= 120; i++) {
                    const a = (i / 120) * 2 * Math.PI;
                    ring.push([lon + (r * Math.sin(a)) / (6371008.8 * Math.cos(lat * k)) / k, lat + (r * Math.cos(a)) / 6371008.8 / k]);
                }
            }
            let allKnown = true;
            const onGround = (lo, la, liftM) => {
                let g = curtainGroundM(lo * k, la * k);
                if (g === undefined) { allKnown = false; g = (cfg.fieldElevFt + cfg.geoidFt) * FT; }
                return Cesium.Cartesian3.fromDegrees(lo, la, g + liftM);
            };
            const pin = viewer.entities.add({
                billboard: { image: REPORT_PIN_ICON, width: 22, height: 22, disableDepthTestDistance: Number.POSITIVE_INFINITY },
                label: {
                    text: label, font: '600 13px "DM Sans", sans-serif', fillColor: Cesium.Color.WHITE,
                    showBackground: true, backgroundColor: color.withAlpha(0.88), backgroundPadding: new Cesium.Cartesian2(8, 5),
                    verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, -16),
                    disableDepthTestDistance: Number.POSITIVE_INFINITY
                }
            });
            const ringEntity = ring.length ? viewer.entities.add({
                polyline: { width: 2.5, material: new Cesium.PolylineDashMaterialProperty({ color, dashLength: 16 }) }
            }) : null;
            let seenEpoch = -1, settled = false;
            viewer.scene.preUpdate.addEventListener(() => {   // place now, and again each time another elevation tile arrives
                if (pin.show !== historyOn) { pin.show = historyOn; if (ringEntity) ringEntity.show = historyOn; }   // History only
                if (settled || seenEpoch === curtainEpoch) return;
                seenEpoch = curtainEpoch;
                allKnown = true;
                pin.position = onGround(lon, lat, 2);
                if (ringEntity) ringEntity.polyline.positions = ring.map(([lo, la]) => onGround(lo, la, 3));
                settled = allKnown;
            });
        }

        // ════════════════════════════════════════════════════════════════
        // [FULLSCREEN] The map's fullscreen button (bottom right) puts this page's own
        // content on screen — the title, Live / History, the Track and Airport lists,
        // the History search row and the map — instead of the whole page, so the site
        // navbar is left out. The matching styles are under [FULLSCREEN] in the CSS.
        // ════════════════════════════════════════════════════════════════
        let fullscreenReady = false;
        function initFullscreen() {
            if (fullscreenReady || !viewer.fullscreenButton) return;
            fullscreenReady = true;
            const page = document.getElementById('main-content');
            viewer.fullscreenButton.viewModel.fullscreenElement = page;
            document.addEventListener(Cesium.Fullscreen.changeEventName, () => {
                page.classList.toggle('a3d-fs', Cesium.Fullscreen.element === page);
            });
        }

        // ── Auth (same pattern as portal.html) ──────────────────────────
        function showAuth() {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('main-content').style.display = 'none';
        }
        function hideAuth() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        async function initUser(user) {
            const snap = await getDoc(doc(db, 'Users', user.uid));
            if (!snap.exists()) { showAuth(); document.getElementById('auth-error').textContent = 'Account not configured.'; return; }
            const profile = snap.data();

            hideAuth();
            initViewer();
            renderLegend();
            initRecentPaths();   // [RECENT PATHS]
            initTrackFocus();    // [TRACK FOCUS]
            initViewButtons();   // [VIEW BUTTONS]

            if (profile.role === 'admin') {
                const selector = document.getElementById('airport-selector');
                selector.style.display = 'flex';
                const select = document.getElementById('airport-select');
                select.innerHTML = Object.entries(AIRPORT_3D).map(([code, info]) => `<option value="${code}">${info.name}</option>`).join('');
                select.onchange = () => startAirport(select.value);
                startAirport(select.value);
            } else {
                startAirport(profile.airport);
            }
            initHistory();       // [HISTORY]
            initFullscreen();    // [FULLSCREEN]
            initSmoothPath();    // [SMOOTH PATH] (before the curtain, so the curtain is drawn at the smoothed height in the same frame)
            initReportPin();     // [REPORT PIN]
            initTrailStyle();    // [TRAIL STYLE]
        }

        window._authSignIn = async () => {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            document.getElementById('auth-error').textContent = '';
            try { await signInWithEmailAndPassword(auth, email, password); }
            catch (e) { document.getElementById('auth-error').textContent = 'Invalid email or password.'; }
        };

        window._authSignOut = () => { auth.signOut(); };

        onAuthStateChanged(auth, user => { if (user) { initUser(user); } else { showAuth(); } });
    </script>

</body>
