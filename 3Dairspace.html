    <style>
        /* ── Auth gate (same pattern as portal.html / dashboard.html) ─────── */
        #auth-screen { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; }
        #auth-screen h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; }
        #auth-form { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }
        #auth-form input { font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        #auth-form input:focus { border-color: #0057ff; }
        #auth-form button { font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 10px; background: #0057ff; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        #auth-form button:hover { background: #0040cc; }
        #auth-error { font-size: 13px; color: #dc2626; text-align: center; min-height: 18px; }
        #airport-selector { display: none; align-items: center; gap: 10px; font-size: 14px; }
        #airport-selector select { font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }

        /* ── 3D view ───────────────────────────────────────────────────────── */
        .a3d-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 1400px; margin: 16px auto 12px; padding: 0 24px; }
        .a3d-header h1 { margin: 0; font-size: 1.4rem; text-align: left; }
        #a3d-wrap { position: relative; max-width: 1400px; margin: 0 auto 24px; padding: 0 24px; }
        #cesiumContainer { width: 100%; height: calc(100vh - 140px); min-height: 480px; border-radius: 10px; overflow: hidden; }
        #a3d-status { position: absolute; top: 12px; left: 36px; padding: 6px 12px; border-radius: 999px; background: rgba(0, 0, 0, 0.6); color: #fff; font: 500 13px 'DM Sans', sans-serif; pointer-events: none; }
        #a3d-status.a3d-error { background: rgba(185, 28, 28, 0.85); }
        #a3d-legend { position: absolute; bottom: 36px; left: 36px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; background: rgba(0, 0, 0, 0.6); color: #fff; font: 500 12px 'DM Sans', sans-serif; pointer-events: none; }
        #a3d-legend .swatch { display: inline-block; width: 18px; height: 4px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
        /* [RECENT PATHS] header controls */
        .a3d-controls { display: flex; align-items: center; gap: 20px; }
        /* [TRACK FOCUS] track picker */
        #track-selector { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        #track-selector select { font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; min-width: 170px; }
        /* [COMPACT INFO] smaller aircraft info panel (Cesium's default is 40% of the view) */
        .cesium-viewer .cesium-infoBox { width: 240px; max-width: 240px; top: 48px; }
        .cesium-viewer .cesium-infoBox-title { font: 600 13px 'DM Sans', sans-serif; height: 16px; padding: 5px 28px 5px 28px; }
        /* [VIEW BUTTONS] on-screen camera controls along the bottom of the view */
        #a3d-legend { top: 50px; bottom: auto; }   /* altitude legend moves under the status pill to make room */
        #a3d-viewbar { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 8px 18px; width: max-content; max-width: calc(100% - 110px); box-sizing: border-box; padding: 10px 14px 8px; border-radius: 12px; background: rgba(0, 0, 0, 0.62); color: #fff; font: 500 12px 'DM Sans', sans-serif; user-select: none; -webkit-user-select: none; }
        .vb-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .vb-row { display: flex; gap: 5px; }
        .vb-btn { display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; margin: 0; padding: 0; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 8px; background: rgba(255, 255, 255, 0.14); color: #fff; font: 600 13px 'DM Sans', sans-serif; line-height: 1; cursor: pointer; touch-action: none; }
        .vb-btn.vb-wide { width: auto; min-width: 46px; padding: 0 12px; }
        .vb-btn:hover { background: rgba(255, 255, 255, 0.3); }
        .vb-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        .vb-btn.vb-on { background: #0057ff; border-color: #0057ff; }
        .vb-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .vb-btn svg { width: 24px; height: 24px; pointer-events: none; }
        .vb-label { font-size: 12px; letter-spacing: 0.02em; opacity: 0.9; }
        #vb-stop { display: none; background: #fff; border-color: #fff; color: #111; }
        #vb-stop:hover { background: #e6e6e6; }
        /* [HISTORY] Live / History switch, search row, and replay timeline */
        #mode-switch { display: inline-flex; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; }
        .mode-btn { margin: 0; padding: 6px 14px; border: none; background: #fff; color: #333; font: 500 14px 'DM Sans', sans-serif; cursor: pointer; }
        .mode-btn + .mode-btn { border-left: 1px solid #ccc; }
        .mode-btn.mode-on { background: #0057ff; color: #fff; }
        #a3d-history { display: none; flex-wrap: wrap; align-items: center; gap: 10px 14px; max-width: 1400px; margin: 0 auto 12px; padding: 0 24px; font-size: 14px; }
        #a3d-history label { display: flex; align-items: center; gap: 6px; }
        #a3d-history input, #a3d-history select { font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
        #hist-tail { width: 96px; text-transform: uppercase; }
        .hist-btn { margin: 0; padding: 7px 14px; border: 1px solid #0057ff; border-radius: 6px; background: #0057ff; color: #fff; font: 500 14px 'DM Sans', sans-serif; cursor: pointer; }
        .hist-btn:hover { background: #0040cc; }
        .hist-btn.hist-btn-2 { background: #fff; color: #0057ff; }
        .hist-btn.hist-btn-2:hover { background: #eef3ff; }
        .hist-or { color: #777; }
        #hist-note { color: #777; font-size: 12.5px; }
        #main-content.hist-on #cesiumContainer { height: calc(100vh - 196px); }
        #main-content.hist-on #a3d-viewbar { max-width: min(calc(100% - 110px), 900px); }
        #hist-timeline { display: none; order: -1; flex: 0 0 100%; box-sizing: border-box; align-items: center; gap: 8px; padding-bottom: 9px; border-bottom: 1px solid rgba(255, 255, 255, 0.22); }
        #hist-timeline .vb-btn { height: 36px; }
        #tl-slider { flex: 1 1 140px; min-width: 110px; margin: 0 2px; accent-color: #4d8dff; cursor: pointer; }
        #tl-time { min-width: 88px; text-align: center; font: 600 13px 'DM Sans', sans-serif; font-variant-numeric: tabular-nums; }
        #tl-speed { height: 36px; padding: 0 6px; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 8px; background: rgba(255, 255, 255, 0.14); color: #fff; font: 600 13px 'DM Sans', sans-serif; cursor: pointer; }
        #tl-speed option { color: #111; }
        /* [FULLSCREEN] The fullscreen button shows only this page's own controls and the map, without the site navbar.
           The map fills everything below the controls, so the view buttons are never cut off. Text turns white on the dark background. */
        #main-content.a3d-fs { display: flex !important; flex-direction: column; background: #111; overflow: hidden; }
        #main-content.a3d-fs .a3d-header { flex: 0 0 auto; max-width: none; margin: 10px 0; }
        #main-content.a3d-fs #a3d-history { flex: 0 0 auto; max-width: none; margin: 0 0 10px; }

        #main-content.a3d-fs .a3d-controls { flex: 0 0 auto; }
        #main-content.a3d-fs .a3d-header h1, #main-content.a3d-fs #track-selector span, #main-content.a3d-fs #airport-selector span, #main-content.a3d-fs #a3d-history label { color: #fff; }
        #main-content.a3d-fs #hist-note, #main-content.a3d-fs .hist-or { color: #b5b5b5; }
        #main-content.a3d-fs #a3d-wrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; max-width: none; margin: 0; padding: 0; }
        #main-content.a3d-fs #cesiumContainer { flex: 1 1 auto; height: auto; min-height: 0; border-radius: 0; }
        #main-content.a3d-fs #a3d-status, #main-content.a3d-fs #a3d-legend { left: 12px; }
        /* [SMOOTH PATH] Smoothed / Recorded switch in the History row */
        #path-switch-wrap { display: inline-flex; align-items: center; gap: 6px; }
        #path-switch { display: inline-flex; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; }
        .path-btn { margin: 0; padding: 6px 12px; border: none; background: #fff; color: #333; font: 500 14px 'DM Sans', sans-serif; cursor: pointer; }
        .path-btn + .path-btn { border-left: 1px solid #ccc; }
        .path-btn.path-on { background: #0057ff; color: #fff; }

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFl5lTFABQa7MvO0vt5R4rbzOtLtkScs0",
            authDomain: "owd-data.firebaseapp.com",
            projectId: "owd-data",
            storageBucket: "owd-data.firebasestorage.app",
            messagingSenderId: "912110224300",
            appId: "1:912110224300:web:ba2b8073871ec023817009",
            measurementId: "G-PHD4THC11M"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ════════════════════════════════════════════════════════════════
        // PER-AIRPORT CONFIG — adding an airport is a new entry here only.
        //   fieldElevFt : charted field elevation (ft MSL)
        //   geoidFt     : geoid height (ft) at the field = ellipsoid minus MSL.
        //                 APPROXIMATE — confirm with the NGS GEOID calculator.
        //   radiusKm / ceilingAglFt : same capture rules as the track logger.
        // ════════════════════════════════════════════════════════════════
        const AIRCRAFT_FEED = 'https://map.fl-technologies-data.com/tar1090/data/aircraft.json';
        const AIRPORT_3D = {
            pou: {
                name: 'POU — Hudson Valley Regional',
                lat: 41.626598, lon: -73.884201,
                fieldElevFt: 163, geoidFt: -104,
                radiusKm: 11.27, ceilingAglFt: 4500,
                feedUrl: AIRCRAFT_FEED
            },
            owd: {
                name: 'OWD — Norwood Memorial',
                lat: 42.1905, lon: -71.1729,          // confirm against charted ARP
                fieldElevFt: 49, geoidFt: -92,        // confirm both
                radiusKm: 11.27, ceilingAglFt: 4500,
                feedUrl: AIRCRAFT_FEED
            }
        };

        // ── Display settings ────────────────────────────────────────────
        const POLL_MS = 2000;           // matches the feed cadence
        const DISPLAY_DELAY_S = 4;      // render slightly behind real time so motion can be interpolated
        const TRAIL_SECONDS = 900;      // trail length (15 min)
        const GAP_BREAK_S = 20;         // don't connect trail points across a gap longer than this
        const STALE_POS_S = 15;         // ignore positions older than this
        const REMOVE_AFTER_S = 60;      // drop an aircraft (and its trail) after this long unseen
        const GROUND_LIFT_M = 1.5;      // keep ground trails just above the surface so they don't flicker
        const FT = 0.3048;

        // Same altitude bands and colors as the noise abatement map (ft MSL)
        const ALT_BANDS = [
            { max: 500,      color: '#e53935', label: '< 500' },
            { max: 1000,     color: '#f59e0b', label: '500 – 1k' },
            { max: 2000,     color: '#a3d65c', label: '1k – 2k' },
            { max: 3500,     color: '#43a047', label: '2k – 3.5k' },
            { max: Infinity, color: '#3b6fe0', label: '> 3.5k' }
        ];
        const BAND_COLORS = ALT_BANDS.map(b => Cesium.Color.fromCssColorString(b.color));

        const USGS_IMAGERY = 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}';

        const PLANE_ICON = 'data:image/svg+xml;utf8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
            '<path d="M16 2 L18.2 12 L29 17.5 L29 20 L18.2 17.2 L17.4 25.2 L21 27.8 L21 29.8 L16 28.4 L11 29.8 L11 27.8 L14.6 25.2 L13.8 17.2 L3 20 L3 17.5 L13.8 12 Z" ' +
            'fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round"/></svg>'
        );

        // ── State ───────────────────────────────────────────────────────
        let viewer = null;
        let cfg = null;
        let tracks = {};                // hex -> track
        let pollTimer = null;
        let pollGen = 0;

        // ── Helpers ─────────────────────────────────────────────────────
        function distanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371, toRad = d => d * Math.PI / 180;
            const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function bandIndex(mslFt) {
            for (let i = 0; i < ALT_BANDS.length; i++) if (mslFt < ALT_BANDS[i].max) return i;
            return ALT_BANDS.length - 1;
        }

        // Altitudes for one aircraft report.
        //   alt_geom is GNSS height above the WGS84 ellipsoid (preferred).
        //   alt_baro is pressure altitude — used as MSL when alt_geom is missing.
        // [TERRAIN] With real terrain, aircraft are placed at their true height above the
        // WGS84 ellipsoid (haeFt), which is what Cesium uses. Aircraft on the ground are
        // placed at field elevation.
        function altitudes(ac, c) {
            if (ac.alt_baro === 'ground') {
                return { onGround: true, mslFt: c.fieldElevFt, haeFt: c.fieldElevFt + c.geoidFt, source: 'ground' };
            }
            let haeFt, source;
            if (typeof ac.alt_geom === 'number') { haeFt = ac.alt_geom; source = 'GNSS'; }
            else if (typeof ac.alt_baro === 'number') { haeFt = ac.alt_baro + c.geoidFt; source = 'baro'; }
            else return null;
            const mslFt = haeFt - c.geoidFt;
            return { onGround: false, mslFt, haeFt, source };
        }

        // [TERRAIN] Free elevation from AWS Terrain Tiles (Tilezen "terrarium" PNGs; built
        // from USGS 3DEP in the US). Heights are decoded from pixel colors, then shifted
        // from sea level to the ellipsoid with the airport's geoid offset.
        const TERRAIN_URL = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
        const TERRAIN_MAX_Z = 15;       // highest zoom the dataset provides; finer tiles are sampled from it
        const TERRAIN_GRID = 65;        // height samples per side of each terrain tile
        const TERRAIN_CACHE_MAX = 400;  // decoded source tiles kept in memory
        const terrainCache = new Map(); // "z/x/y" -> Promise<{ size, h } | null>

        function loadTerrarium(z, x, y) {
            const key = `${z}/${x}/${y}`;
            if (terrainCache.has(key)) return terrainCache.get(key);
            const p = (async () => {
                try {
                    const url = TERRAIN_URL.replace('{z}', z).replace('{x}', x).replace('{y}', y);
                    const res = await fetch(url);
                    if (!res.ok) return null;
                    // keep raw pixel values: no color-space or alpha adjustments
                    const bmp = await createImageBitmap(await res.blob(), { colorSpaceConversion: 'none', premultiplyAlpha: 'none' });
                    const canvas = new OffscreenCanvas(bmp.width, bmp.height);
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(bmp, 0, 0);
                    const px = ctx.getImageData(0, 0, bmp.width, bmp.height).data;
                    const n = bmp.width * bmp.height;
                    const h = new Float32Array(n);
                    for (let i = 0; i < n; i++) h[i] = px[i * 4] * 256 + px[i * 4 + 1] + px[i * 4 + 2] / 256 - 32768;   // meters
                    return { size: bmp.width, h };
                } catch (err) {
                    return null;
                }
            })();
            terrainCache.set(key, p);
            if (terrainCache.size > TERRAIN_CACHE_MAX) terrainCache.delete(terrainCache.keys().next().value);
            return p;
        }

        async function terrainHeights(x, y, level) {
            // Use the tile itself up to zoom 15; above that (or if a tile is missing), sample from an ancestor.
            let z = Math.min(level, TERRAIN_MAX_Z), tile = null, sx = x, sy = y;
            for (; z >= 0 && level - z <= 8; z--) {
                sx = x >> (level - z);
                sy = y >> (level - z);
                tile = await loadTerrarium(z, sx, sy);
                if (tile) break;
            }
            const G = TERRAIN_GRID;
            const out = new Float32Array(G * G);
            const geoidM = (cfg ? cfg.geoidFt : 0) * FT;
            if (!tile) { out.fill(geoidM); return out; }
            const span = 1 << (level - z);
            const ox = (x - sx * span) / span, oy = (y - sy * span) / span, sc = 1 / span;
            const S = tile.size, H = tile.h;
            for (let r = 0; r < G; r++) {
                let fy = (oy + (r / (G - 1)) * sc) * S - 0.5;
                fy = Math.min(Math.max(fy, 0), S - 1);
                const y0 = Math.floor(fy), y1 = Math.min(y0 + 1, S - 1), ty = fy - y0;
                for (let col = 0; col < G; col++) {
                    let fx = (ox + (col / (G - 1)) * sc) * S - 0.5;
                    fx = Math.min(Math.max(fx, 0), S - 1);
                    const x0 = Math.floor(fx), x1 = Math.min(x0 + 1, S - 1), tx = fx - x0;
                    const top = H[y0 * S + x0] * (1 - tx) + H[y0 * S + x1] * tx;
                    const bot = H[y1 * S + x0] * (1 - tx) + H[y1 * S + x1] * tx;
                    out[r * G + col] = top * (1 - ty) + bot * ty + geoidM;
                }
            }
            return out;
        }

        function setStatus(text, isError = false) {
            const el = document.getElementById('a3d-status');
            el.textContent = text;
            el.classList.toggle('a3d-error', isError);
        }

        function renderLegend() {
            document.getElementById('a3d-legend').innerHTML = '<span>Alt (ft MSL):</span>' +
                ALT_BANDS.map(b => `<span><span class="swatch" style="background:${b.color}"></span>${b.label}</span>`).join('');
        }

        // ── Viewer ──────────────────────────────────────────────────────
        function initViewer() {
            if (viewer) return;
            viewer = new Cesium.Viewer('cesiumContainer', {
                baseLayer: new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({
                    url: USGS_IMAGERY,
                    maximumLevel: 16,
                    credit: new Cesium.Credit('Imagery: USDA, USGS The National Map')
                })),
                // [TERRAIN] real elevation instead of the flat surface
                terrainProvider: new Cesium.CustomHeightmapTerrainProvider({
                    width: TERRAIN_GRID,
                    height: TERRAIN_GRID,
                    tilingScheme: new Cesium.WebMercatorTilingScheme(),
                    callback: terrainHeights,
                    credit: 'Terrain: Tilezen terrain tiles (USGS 3DEP and others) via AWS Open Data'
                }),
                baseLayerPicker: false,   // avoids Cesium ion imagery
                geocoder: false,          // avoids Cesium ion search
                timeline: false,
                animation: false,
                sceneModePicker: false,
                homeButton: true,
                fullscreenButton: true,
                navigationHelpButton: true,
                navigationInstructionsInitiallyVisible: false,
                infoBox: true,
                selectionIndicator: true
            });
            viewer.scene.screenSpaceCameraController.minimumZoomDistance = 100;
            viewer.clock.clockStep = Cesium.ClockStep.SYSTEM_CLOCK_MULTIPLIER;
            viewer.clock.multiplier = 1;
            viewer.clock.shouldAnimate = true;
            // Home button returns to the airport instead of the whole globe
            viewer.homeButton.viewModel.command.beforeExecute.addEventListener(e => {
                e.cancel = true;
                if (typeof setFocus === 'function') setFocus(null);   // [TRACK FOCUS] home also returns to all aircraft
                if (cfg) frameAirport(cfg);
            });
            // [COMPACT INFO] the panel's rows live in an iframe, so its styles are added there
            const frame = viewer.infoBox.frame;
            const compactInfoStyle = () => {
                const d = frame.contentDocument;
                if (!d || !d.head || d.getElementById('a3d-compact')) return;
                const st = d.createElement('style');
                st.id = 'a3d-compact';
                st.textContent =
                    '.cesium-infoBox-description { font-family: "DM Sans", sans-serif; font-size: 12px; padding: 4px 6px; }' +
                    '.cesium-infoBox-defaultTable th, .cesium-infoBox-defaultTable td { padding: 2px 6px; font-size: 12px; line-height: 1.35; }' +
                    '.cesium-infoBox-defaultTable th { text-align: left; white-space: nowrap; color: #b8c4c4; }';
                d.head.appendChild(st);
            };
            frame.addEventListener('load', compactInfoStyle);
            compactInfoStyle();
            // [3D MODELS] light the models from the camera so they look the same day or night
            const headlamp = new Cesium.DirectionalLight({ direction: Cesium.Cartesian3.clone(viewer.camera.directionWC) });
            viewer.scene.light = headlamp;
            viewer.scene.preRender.addEventListener(() => Cesium.Cartesian3.clone(viewer.camera.directionWC, headlamp.direction));
        }

        function frameAirport(c) {
            const center = Cesium.Cartesian3.fromDegrees(c.lon, c.lat, (c.fieldElevFt + c.geoidFt) * FT);   // [TERRAIN] look at the field's real height
            viewer.camera.lookAt(center, new Cesium.HeadingPitchRange(Cesium.Math.toRadians(20), Cesium.Math.toRadians(-28), 14000));
            viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);   // release the camera so it can be moved freely
        }

        // Keep the display clock DISPLAY_DELAY_S behind the receiver's clock
        function syncClock(feedNowSec) {
            const target = Cesium.JulianDate.fromDate(new Date((feedNowSec - DISPLAY_DELAY_S) * 1000));
            if (Math.abs(Cesium.JulianDate.secondsDifference(viewer.clock.currentTime, target)) > 1.5) {
                viewer.clock.currentTime = target;
            }
        }

        // ── Tracks ──────────────────────────────────────────────────────
        function createTrack(hex) {
            const samples = new Cesium.SampledPositionProperty();
            samples.forwardExtrapolationType = Cesium.ExtrapolationType.HOLD;
            samples.backwardExtrapolationType = Cesium.ExtrapolationType.HOLD;
            const tr = { hex, samples, segs: [], last: null, lastSeenWall: Date.now() };

            tr.entity = viewer.entities.add({
                position: samples,
                billboard: {
                    image: PLANE_ICON,
                    width: 26,
                    height: 26,
                    alignedAxis: Cesium.Cartesian3.ZERO,   // [HEADING FIX] set to the direction of travel once the track is known
                    disableDepthTestDistance: Number.POSITIVE_INFINITY
                },
                label: {
                    text: '',
                    font: '600 12px "DM Sans", sans-serif',
                    fillColor: Cesium.Color.WHITE,
                    showBackground: true,
                    backgroundColor: new Cesium.Color(0, 0, 0, 0.55),
                    pixelOffset: new Cesium.Cartesian2(0, -30),
                    disableDepthTestDistance: Number.POSITIVE_INFINITY
                }
            });

            // Thin dashed line from the aircraft straight down to the ground
            tr.drop = viewer.entities.add({
                polyline: {
                    positions: new Cesium.CallbackProperty(time => {
                        const p = samples.getValue(time);
                        if (!p) return [];
                        const c = Cesium.Cartographic.fromCartesian(p);
                        if (!c) return [];
                        // [TERRAIN] drop to the terrain surface below the aircraft (field elevation until terrain loads)
                        let groundM = viewer.scene.globe.getHeight(c);
                        if (groundM === undefined) groundM = (cfg.fieldElevFt + cfg.geoidFt) * FT;
                        if (c.height - groundM < 3) return [];
                        return [p, Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, groundM)];
                    }, false),
                    width: 1,
                    material: new Cesium.PolylineDashMaterialProperty({ color: Cesium.Color.WHITE.withAlpha(0.6), dashLength: 8 })
                }
            });
            tr.entity._a3dHex = hex;   // [TRACK FOCUS] lets a click on the icon, trail or drop line find its aircraft
            tr.drop._a3dHex = hex;     // [TRACK FOCUS]
            tr.entity.viewFrom = new Cesium.Cartesian3(0, -2500, 1200);   // [TRACK FOCUS] follow-camera offset: 2.5 km south, 1.2 km up
            // [3D MODELS] 3D model instead of the flat icon, with orientation sampled over time
            tr.orient = new Cesium.SampledProperty(Cesium.Quaternion);
            tr.orient.forwardExtrapolationType = Cesium.ExtrapolationType.HOLD;
            tr.orient.backwardExtrapolationType = Cesium.ExtrapolationType.HOLD;
            tr.entity.orientation = tr.orient;
            tr.entity.model = new Cesium.ModelGraphics({
                uri: MODEL_URLS.generic,
                minimumPixelSize: Math.round(ICON_SHAPES.generic.size * MODEL_PIXEL_SCALE),
                silhouetteColor: Cesium.Color.fromCssColorString('#0b1626'),   // [HIGH VIS] dark outline
                silhouetteSize: 2                                              // [HIGH VIS]
            });
            tr.entity.billboard.show = false;
            return tr;
        }

        // Trail points visible at `time`; the newest segment extends to the aircraft's
        // interpolated position so the trail never runs ahead of or behind the icon.
        function segPositions(tr, seg, time) {
            const nowSec = Cesium.JulianDate.toDate(time).getTime() / 1000;
            const out = [];
            for (const p of seg.pts) {
                if (p.sec <= nowSec) out.push(p.pos);
                else break;
            }
            if (seg === tr.segs[tr.segs.length - 1] && out.length) {
                const head = tr.samples.getValue(time);
                if (head) out.push(head);
            }
            return out;
        }

        // Trails are split into segments by altitude band so each can carry its band color.
        function addPoint(tr, sec, pos, band) {
            tr.samples.addSample(Cesium.JulianDate.fromDate(new Date(sec * 1000)), pos);
            const pt = { sec, pos };
            let seg = tr.segs[tr.segs.length - 1];
            const gap = tr.last && (sec - tr.last.sec) > GAP_BREAK_S;
            if (!seg || gap || seg.band !== band) {
                const newSeg = { band, pts: [] };
                if (seg && !gap) newSeg.pts.push(seg.pts[seg.pts.length - 1]);   // share the boundary point so the trail stays continuous
                newSeg.entity = viewer.entities.add({
                    polyline: {
                        positions: new Cesium.CallbackProperty(time => segPositions(tr, newSeg, time), false),
                        width: 3,
                        material: BAND_COLORS[band]
                    }
                });
                newSeg.entity._a3dHex = tr.hex;                          // [TRACK FOCUS]
                newSeg.entity.show = !focusHex || focusHex === tr.hex;   // [TRACK FOCUS] hide other trails while one is selected
                tr.segs.push(newSeg);
                seg = newSeg;
            }
            seg.pts.push(pt);
            tr.last = pt;
        }

        function trimTrack(tr, cutoffSec) {
            while (tr.segs.length > 1 && tr.segs[0].pts[tr.segs[0].pts.length - 1].sec < cutoffSec) {
                viewer.entities.remove(tr.segs[0].entity);
                tr.segs.shift();
            }
            const first = tr.segs[0];
            if (first) while (first.pts.length > 2 && first.pts[1].sec < cutoffSec) first.pts.shift();
            const old = Cesium.JulianDate.fromDate(new Date((cutoffSec - 60) * 1000));
            tr.samples.removeSamples(new Cesium.TimeInterval({ start: Cesium.JulianDate.fromDate(new Date(0)), stop: old }));
            if (tr.orient) tr.orient.removeSamples(new Cesium.TimeInterval({ start: Cesium.JulianDate.fromDate(new Date(0)), stop: old }));   // [3D MODELS]
        }

        function removeTrack(tr) {
            if (focusHex === tr.hex) setFocus(null);   // [TRACK FOCUS] selected aircraft left: back to all
            viewer.entities.remove(tr.entity);
            viewer.entities.remove(tr.drop);
            for (const s of tr.segs) viewer.entities.remove(s.entity);
            delete tracks[tr.hex];
        }

        function clearTracks() {
            for (const hex in tracks) removeTrack(tracks[hex]);
            tracks = {};
        }

        function updateInfo(tr, ac, alt) {
            const reg = ac.r || (ac.flight || '').trim() || ac.hex.toUpperCase();
            const altText = alt.onGround ? 'GND' : `${Math.round(alt.mslFt).toLocaleString()} ft`;
            setAttitude(tr, ac);   // [3D MODELS] heading (ground: true heading first), pitch, bank
            tr.entity.label.text = `${reg}\n${altText}`;
            tr.entity.name = reg;
            enrichAircraft(ac);   // [AIRCRAFT ICONS] registration + type for the info panel, icon class
            applyIcon(tr, ac);    // [AIRCRAFT ICONS]
            const rows = [
                ['Registration', ac.r || '—'],
                ['Callsign', (ac.flight || '').trim() || '—'],
                ['ICAO hex', ac.hex.toUpperCase()],
                ['Type', ac.t || '—'],
                ['Altitude (MSL)', alt.onGround ? 'On ground' : `${Math.round(alt.mslFt).toLocaleString()} ft`],
                ['Height above field', alt.onGround ? '0 ft' : `${Math.round(alt.mslFt - cfg.fieldElevFt).toLocaleString()} ft`],
                ['Altitude source', alt.source],
                ['Ground speed', typeof ac.gs === 'number' ? `${Math.round(ac.gs)} kt` : '—'],
                ['Track', typeof ac.track === 'number' ? `${Math.round(ac.track)}°` : '—']
            ];
            tr.entity.description = '<table class="cesium-infoBox-defaultTable"><tbody>' +
                rows.filter(([, v]) => v !== '—')   // [COMPACT INFO] skip rows with no data
                    .map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('') + '</tbody></table>';
        }

        // ════════════════════════════════════════════════════════════════
        // [TRACK FOCUS] Show one aircraft's track at a time.
        //  • Pick from the Track list, or click an aircraft / its trail in the view.
        //  • Other aircraft stay visible, but only the selected trail is drawn.
        //  • The camera follows the selected aircraft (it can still be rotated/zoomed).
        //  • "All aircraft", clicking empty space, or the home button returns to all.
        // ════════════════════════════════════════════════════════════════
        let focusHex = null;
        let settingFocus = false;   // ignore selection events caused by setFocus itself
        let trackListKey = '';

        function setFocus(hex) {
            if (hex && !tracks[hex]) hex = null;
            focusHex = hex;
            for (const h in tracks) {
                const show = !focusHex || focusHex === h;
                for (const s of tracks[h].segs) s.entity.show = show;
            }
            settingFocus = true;
            try {
                const ent = hex ? tracks[hex].entity : undefined;
                viewer.trackedEntity = ent;
                if (viewer.selectedEntity !== ent) viewer.selectedEntity = ent;
            } finally {
                settingFocus = false;
            }
            document.getElementById('track-select').value = hex || '';
        }

        // Keep the Track list in sync with the aircraft in view (rebuilt only when that set changes)
        function refreshTrackList() {
            const sel = document.getElementById('track-select');
            const items = Object.values(tracks)
                .map(tr => [tr.hex, tr.entity.name || tr.hex.toUpperCase()])
                .sort((a, b) => a[1].localeCompare(b[1]));
            const key = items.map(i => i.join(':')).join('|');
            if (key === trackListKey) return;
            trackListKey = key;
            sel.innerHTML = '';
            const all = document.createElement('option');
            all.value = '';
            all.textContent = `All aircraft (${items.length})`;
            sel.appendChild(all);
            for (const [hex, name] of items) {
                const o = document.createElement('option');
                o.value = hex;
                o.textContent = name;
                sel.appendChild(o);
            }
            sel.value = focusHex || '';
        }

        function initTrackFocus() {
            const sel = document.getElementById('track-select');
            sel.addEventListener('change', () => setFocus(sel.value || null));
            viewer.selectedEntityChanged.addEventListener(ent => {
                if (settingFocus) return;
                setFocus((ent && ent._a3dHex) || null);   // clicking empty space (or closing the info panel) returns to all
            });
        }

        // ════════════════════════════════════════════════════════════════
        // [RECENT PATHS] History from tar1090's rolling snapshots ("chunks").
        //  • Gap fill (always on): [GAP FIX] if live updates stop for more than
        //    GAP_BREAK_S for any reason (tab in the background, browser throttling,
        //    laptop asleep, network drop), trails are rebuilt from history, just
        //    like a reload. The selected track, if any, is kept.
        //  • Recent paths (always on): when an airport loads, trails start with the
        //    last TRAIL_SECONDS of history for aircraft currently in view.
        // The history has pressure altitude only; each aircraft's live GNSS-vs-baro
        // difference is applied when known so backfilled trails meet live ones cleanly.
        // ════════════════════════════════════════════════════════════════
        const HISTORY_BASE = 'https://map.fl-technologies-data.com/tar1090/chunks/';
        const HISTORY_MAX_CHUNKS = 8;   // most chunk files to load for one backfill
        let backfillCount = 0;          // live polling waits while history is being added
        let lastFeedNow = null;         // receiver time (s) of the last live update
        let lastFeedWall = 0;           // browser time (ms) of the last live update
        let hiddenAtSec = null;         // receiver time when the tab was hidden
        const geomOffsets = {};         // hex -> alt_geom minus alt_baro (ft), learned from the live feed
        let skipGapCheck = false;       // [GAP FIX] first live update after a rebuild isn't treated as a gap

        function estimateFeedNow() {
            return lastFeedNow != null ? lastFeedNow + (Date.now() - lastFeedWall) / 1000 : Date.now() / 1000;
        }

        // Chunk files are gzipped JSON; handles both auto-decompressed and raw gzip responses.
        async function fetchJsonMaybeGzip(url) {
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
            const buf = new Uint8Array(await res.arrayBuffer());
            if (buf[0] === 0x1f && buf[1] === 0x8b) {
                const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
                return JSON.parse(await new Response(stream).text());
            }
            return JSON.parse(new TextDecoder().decode(buf));
        }

        // Snapshots [{ now, aircraft: [[hex, alt_baro, gs, track, lat, lon, seen_pos, ...], ...] }]
        // reaching back to fromSec, oldest first.
        async function loadHistory(fromSec) {
            const index = await fetchJsonMaybeGzip(`${HISTORY_BASE}chunks.json?_=${Date.now()}`);
            const names = index.chunks || [];
            const stamp = n => Number((n.match(/(\d{10,})/) || [0, 0])[1]);
            const current = names.filter(n => n.startsWith('current'));
            const olderAsListed = names.filter(n => !n.startsWith('current'));
            // newest first: by the timestamp in the file name, or reversed listing order if names carry none
            const older = olderAsListed.every(n => stamp(n) > 0)
                ? olderAsListed.slice().sort((a, b) => stamp(b) - stamp(a))
                : olderAsListed.slice().reverse();
            const snaps = [];
            const take = f => { for (const s of (f && f.files) || []) snaps.push(s); };
            for (const n of current) take(await fetchJsonMaybeGzip(`${HISTORY_BASE}${n}?_=${Date.now()}`));
            for (const n of older.slice(0, HISTORY_MAX_CHUNKS)) {
                const f = await fetchJsonMaybeGzip(`${HISTORY_BASE}${n}`);
                take(f);
                const times = ((f && f.files) || []).map(s => s.now);
                if (times.length && Math.min(...times) <= fromSec) break;
            }
            return snaps.sort((a, b) => a.now - b.now);
        }

        function historyAltitudes(hex, altBaro) {
            if (altBaro === 'ground') return { onGround: true, mslFt: cfg.fieldElevFt, haeFt: cfg.fieldElevFt + cfg.geoidFt };
            if (typeof altBaro !== 'number') return null;
            const haeFt = (hex in geomOffsets) ? altBaro + geomOffsets[hex] : altBaro + cfg.geoidFt;
            return { onGround: false, mslFt: haeFt - cfg.geoidFt, haeFt };
        }

        // rebuild = true: replace all trails with history (on airport load).
        // rebuild = false: append history after each trail's last point (gap fill).
        async function backfill(fromSec, rebuild) {
            if (!cfg) return;
            const gen = pollGen;
            backfillCount++;
            setStatus(rebuild ? 'Loading recent paths…' : 'Filling in while you were away…');
            try {
                const snaps = await loadHistory(fromSec);
                if (gen !== pollGen || !snaps.length) return;   // airport switched, or no history

                // "In view" = a fresh position inside the radius in the newest snapshot
                const newest = snaps[snaps.length - 1];
                const inView = new Set();
                for (const a of newest.aircraft || []) {
                    const [hex, , , , lat, lon, seenPos] = a;
                    if (lat == null || lon == null) continue;
                    if (typeof seenPos === 'number' && seenPos > STALE_POS_S) continue;
                    if (distanceKm(cfg.lat, cfg.lon, lat, lon) <= cfg.radiusKm) inView.add(hex);
                }

                const hist = {};
                for (const s of snaps) {
                    if (s.now < fromSec) continue;
                    for (const a of s.aircraft || []) {
                        const [hex, altBaro, gs, track, lat, lon, seenPos] = a;   // [3D MODELS] gs added
                        if (!inView.has(hex) || lat == null || lon == null) continue;
                        if (typeof seenPos === 'number' && seenPos > STALE_POS_S) continue;
                        if (distanceKm(cfg.lat, cfg.lon, lat, lon) > cfg.radiusKm) continue;
                        const alt = historyAltitudes(hex, altBaro);
                        if (!alt) continue;
                        (hist[hex] ||= []).push({ sec: s.now - (seenPos || 0), lat, lon, alt, track, gs });   // [3D MODELS] gs added
                    }
                }

                if (rebuild) clearTracks();
                const wallNow = Date.now();
                for (const hex in hist) {
                    const pts = hist[hex].sort((a, b) => a.sec - b.sec);
                    let tr = tracks[hex];
                    if (!tr) {
                        // same rule as live: only follow aircraft that were at/below the ceiling
                        if (!pts.some(p => p.alt.onGround || (p.alt.mslFt - cfg.fieldElevFt) <= cfg.ceilingAglFt)) continue;
                        tr = tracks[hex] = createTrack(hex);
                        tr.entity.label.text = hex.toUpperCase();   // registration fills in on the next live update
                    }
                    tr.lastSeenWall = wallNow;
                    for (const p of pts) {
                        if (tr.last && p.sec <= tr.last.sec) continue;   // only add points newer than the trail
                        const heightM = p.alt.haeFt * FT + (p.alt.onGround ? GROUND_LIFT_M : 0);
                        addPoint(tr, p.sec, Cesium.Cartesian3.fromDegrees(p.lon, p.lat, heightM), bandIndex(p.alt.mslFt));
                        setAttitude(tr, { alt_baro: p.alt.onGround ? 'ground' : 0, gs: p.gs, track: p.track, lat: p.lat, lon: p.lon });   // [3D MODELS]
                    }
                }
            } catch (err) {
                console.warn('[3D] recent-path history unavailable:', err);
            } finally {
                backfillCount--;
                skipGapCheck = true;   // [GAP FIX]
            }
        }

        // [GAP FIX] Rebuild trails from history after a gap, keeping the selected track
        async function refillAfterGap() {
            const keep = focusHex;
            await backfill(estimateFeedNow() - TRAIL_SECONDS, true);
            if (keep && tracks[keep]) setFocus(keep);
        }

        function initRecentPaths() {
            // [GAP FIX] Gaps are now detected from the live feed in poll(), so no tab-visibility
            // handling is needed here.
        }

        // ════════════════════════════════════════════════════════════════
        // [AIRCRAFT ICONS] Icon shape by aircraft type (original silhouettes in the
        // style of tar1090's markers).
        //  1. US aircraft: N-number worked out from the transponder address (FAA's
        //     fixed mapping), then the ICAO type code from your FAA registry
        //     (icaocodeRegistry.js, the same file landing fees uses).
        //  2. Otherwise the callsign is tried in the registry (covers foreign
        //     registrations flying under their registration).
        //  3. Otherwise the ADS-B emitter category the aircraft broadcasts.
        //  New type codes added to the registry later fall back to step 3 until
        //  they are listed in ICON_TYPE_CODES below.
        // ════════════════════════════════════════════════════════════════
        const NN_LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ', NN_ALL = NN_LETTERS + '0123456789';
        const NN_SUF = 1 + NN_LETTERS.length * (1 + NN_LETTERS.length);
        const NN_B4 = 1 + NN_LETTERS.length + 10, NN_B3 = 10 * NN_B4 + NN_SUF, NN_B2 = 10 * NN_B3 + NN_SUF, NN_B1 = 10 * NN_B2 + NN_SUF;
        function nnSuffix(o) {
            if (!o) return '';
            const c0 = NN_LETTERS[Math.floor((o - 1) / (NN_LETTERS.length + 1))], r = (o - 1) % (NN_LETTERS.length + 1);
            return r ? c0 + NN_LETTERS[r - 1] : c0;
        }
        // US ICAO address (A00001–ADF7C7) -> N-number, e.g. a075ae -> N129FR; null if not a US address
        function hexToNNumber(hex) {
            let i = parseInt(hex, 16) - 0xA00001;
            if (!(i >= 0 && i < 9 * NN_B1)) return null;
            let out = 'N' + (Math.floor(i / NN_B1) + 1);
            i %= NN_B1;
            for (const B of [NN_B2, NN_B3]) {
                if (i < NN_SUF) return out + nnSuffix(i);
                i -= NN_SUF;
                out += Math.floor(i / B);
                i %= B;
            }
            if (i < NN_SUF) return out + nnSuffix(i);
            i -= NN_SUF;
            out += Math.floor(i / NN_B4);
            i %= NN_B4;

        const MODEL_COLORS = {

            accent: [0.17, 0.17, 0.17, 1],

        function meshParts() { return { body: [], accent: [], disc: [] }; }

                return ring;
            });
            for (let i = 0; i < pts.length - 1; i++)
                for (let k = 0; k < sides; k++) { const k2 = (k + 1) % sides; quad(a, pts[i][k], pts[i][k2], pts[i + 1][k2], pts[i + 1][k]); }

        // Flat plate: polygon (u, v) extruded ±t/2 along w; map(u, v, w) -> [x, y, z]
        function slab(a, poly, t, map) {

            for (let i = 1; i < poly.length - 1; i++) { tri(a, top[0], top[i], top[i + 1]); tri(a, bot[0], bot[i + 1], bot[i]); }
            for (let i = 0; i < poly.length; i++) { const j = (i + 1) % poly.length; quad(a, top[i], top[j], bot[j], bot[i]); }

                y: (u, v, w) => [c[0] + u, c[1] + w, c[2] + v],

        const FUSE_PROP = [[1, 0.3, 0.4, -0.15], [0.86, 0.85, 0.85, 0], [0.55, 1, 1, 0], [0.15, 1, 1, 0.05], [-0.35, 0.55, 0.65, 0.2], [-0.82, 0.22, 0.32, 0.4], [-1, 0.1, 0.22, 0.45]];
        const FUSE_JET  = [[1, 0.12, 0.15, -0.25], [0.92, 0.55, 0.6, -0.08], [0.78, 0.95, 0.95, 0], [0.5, 1, 1, 0], [-0.45, 1, 1, 0], [-0.8, 0.55, 0.65, 0.18], [-1, 0.14, 0.28, 0.42]];

        function buildModel(cls) {

        // Pack mesh parts into a glTF 2.0 model (flat shading) and return a blob URL for it
        function meshToGltfUrl(m) {
            const prims = [], views = [], accessors = [], chunks = [];
            let offset = 0;
            const materials = Object.values(MODEL_COLORS).map(c => ({
                pbrMetallicRoughness: { baseColorFactor: c, metallicFactor: 0, roughnessFactor: 0.75 },
                doubleSided: true, alphaMode: c[3] < 1 ? 'BLEND' : 'OPAQUE'
            }));
            Object.keys(MODEL_COLORS).forEach((key, mi) => {
                const v = m[key];
                if (!v.length) return;
                const n = v.length, pos = new Float32Array(n * 3), nor = new Float32Array(n * 3);
                const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
                for (let i = 0; i < n; i += 3) {
                    const [a, b, c] = [v[i], v[i + 1], v[i + 2]];
                    const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], w = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
                    let nx = u[1] * w[2] - u[2] * w[1], ny = u[2] * w[0] - u[0] * w[2], nz = u[0] * w[1] - u[1] * w[0];
                    const l = Math.hypot(nx, ny, nz);
                    if (l > 1e-9) { nx /= l; ny /= l; nz /= l; } else { nx = 0; ny = 1; nz = 0; }
                    for (let k = 0; k < 3; k++) {
                        const p = v[i + k], j = (i + k) * 3;
                        pos[j] = p[0]; pos[j + 1] = p[1]; pos[j + 2] = p[2];
                        nor[j] = nx; nor[j + 1] = ny; nor[j + 2] = nz;
                        for (let d = 0; d < 3; d++) { mn[d] = Math.min(mn[d], p[d]); mx[d] = Math.max(mx[d], p[d]); }
                    }
                }
                for (const [arr, isPos] of [[pos, true], [nor, false]]) {
                    views.push({ buffer: 0, byteOffset: offset, byteLength: arr.byteLength, target: 34962 });
                    accessors.push(Object.assign({ bufferView: views.length - 1, componentType: 5126, count: n, type: 'VEC3' }, isPos ? { min: mn, max: mx } : {}));
                    chunks.push(new Uint8Array(arr.buffer));
                    offset += arr.byteLength;
                }
                prims.push({ attributes: { POSITION: accessors.length - 2, NORMAL: accessors.length - 1 }, material: mi });
            });
            const bytes = new Uint8Array(offset);
            let o = 0;
            for (const c of chunks) { bytes.set(c, o); o += c.length; }
            let bin = '';
            for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            const gltf = {
                asset: { version: '2.0', generator: 'FlightLevel 3D airspace' },
                scene: 0, scenes: [{ nodes: [0] }], nodes: [{ mesh: 0 }], meshes: [{ primitives: prims }],
                materials, accessors, bufferViews: views,
                buffers: [{ byteLength: offset, uri: 'data:application/octet-stream;base64,' + btoa(bin) }]
            };
            return URL.createObjectURL(new Blob([JSON.stringify(gltf)], { type: 'model/gltf+json' }));
        }

        const MODEL_URLS = {};
        for (const cls of Object.keys(ICON_SHAPES)) MODEL_URLS[cls] = meshToGltfUrl(buildModel(cls));
        const MODEL_PIXEL_SCALE = 1.6;    // model minimum on-screen size = icon size × this (raise for bigger aircraft when zoomed out)

        // Heading to draw, in degrees true. On the ground, true_heading first (the track can be
        // stale while stopped); in the air, track first. Falls back to the direction of movement,
        // then to the last known heading.
        const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
        function headingFor(tr, ac) {
            const onGround = ac.alt_baro === 'ground', gs = num(ac.gs) || 0;
            let h = onGround
                ? (num(ac.true_heading) ?? (gs >= 2 ? num(ac.track) : null) ?? num(ac.calc_track))
                : (num(ac.track) ?? num(ac.true_heading) ?? num(ac.calc_track));
            if (h == null && ac.lat != null && ac.lon != null) {   // from movement since the last reference point
                const ref = tr.moveRef;
                if (!ref) tr.moveRef = { lat: ac.lat, lon: ac.lon };
                else if (distanceKm(ref.lat, ref.lon, ac.lat, ac.lon) > 0.008) {
                    const p1 = ref.lat * Math.PI / 180, p2 = ac.lat * Math.PI / 180, dl = (ac.lon - ref.lon) * Math.PI / 180;
                    h = (Math.atan2(Math.sin(dl) * Math.cos(p2), Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl)) * 180 / Math.PI + 360) % 360;
                    tr.moveRef = { lat: ac.lat, lon: ac.lon };
                }
            } else if (ac.lat != null) {
                tr.moveRef = { lat: ac.lat, lon: ac.lon };
            }
            if (h == null) h = tr.lastHeading ?? null;
            if (h != null) tr.lastHeading = h;
            return h;
        }

        // Orientation (heading, pitch from climb rate, bank where reported), sampled over time so
        // turns are smooth, like position.
        function setAttitude(tr, ac) {
            if (!tr.last || ac.lat == null || ac.lon == null) return;
            const hdg = headingFor(tr, ac);
            if (hdg == null) return;
            const airborne = ac.alt_baro !== 'ground', gs = num(ac.gs) || 0;
            const vr = num(ac.geom_rate) ?? num(ac.baro_rate);
            const pitch = (airborne && vr != null && gs > 30) ? Math.max(-12, Math.min(12, Math.atan2(vr * 0.00508, gs * 0.5144) * 180 / Math.PI)) : 0;
            const roll = airborne ? Math.max(-45, Math.min(45, num(ac.roll) ?? 0)) : 0;

            const enu = Cesium.Transforms.eastNorthUpToFixedFrame(Cesium.Cartesian3.fromDegrees(ac.lon, ac.lat));
            const col = i => Cesium.Matrix4.getColumn(enu, i, new Cesium.Cartesian4());
            const E = col(0), N = col(1), U3 = col(2);
            const v3 = (c4) => new Cesium.Cartesian3(c4.x, c4.y, c4.z);
            const e = v3(E), n = v3(N), u = v3(U3);
            const lin = (a, ka, b, kb) => Cesium.Cartesian3.add(Cesium.Cartesian3.multiplyByScalar(a, ka, new Cesium.Cartesian3()), Cesium.Cartesian3.multiplyByScalar(b, kb, new Cesium.Cartesian3()), new Cesium.Cartesian3());
            const t = hdg * Math.PI / 180, p = pitch * Math.PI / 180, r = roll * Math.PI / 180;
            const F = lin(e, Math.sin(t), n, Math.cos(t));
            const L = Cesium.Cartesian3.cross(u, F, new Cesium.Cartesian3());
            const Fp = lin(F, Math.cos(p), u, Math.sin(p)), Up = lin(F, -Math.sin(p), u, Math.cos(p));
            const Ur = lin(Up, Math.cos(r), L, -Math.sin(r)), Lr = lin(L, Math.cos(r), Up, Math.sin(r));
            const m3 = new Cesium.Matrix3();
            Cesium.Matrix3.setColumn(m3, 0, Fp, m3);
            Cesium.Matrix3.setColumn(m3, 1, Lr, m3);
            Cesium.Matrix3.setColumn(m3, 2, Ur, m3);
            tr.orient.addSample(Cesium.JulianDate.fromDate(new Date(tr.last.sec * 1000)), Cesium.Quaternion.fromRotationMatrix(m3));
        }

        // ════════════════════════════════════════════════════════════════
        // [VIEW BUTTONS] Large on-screen buttons for moving the view, for people who
        // don't want to learn the mouse controls. Press and hold to keep moving; a
        // quick click gives a small step. The mouse and trackpad controls are unchanged.
        //  • Move: slides the view (not available while following an aircraft).
        //  • Rotate / View angle / Zoom: pivot on the middle of the view, or on the
        //    aircraft while one is being followed.
        //  • Reset: back to the airport, showing all aircraft.
        //  • Stop following: shown only while an aircraft is selected.
        // ════════════════════════════════════════════════════════════════
        const VIEW_MOVE_PER_S = 0.5;        // slide speed, as a fraction of the distance to the middle of the view
        const VIEW_TURN_DEG_PER_S = 45;
        const VIEW_TILT_DEG_PER_S = 30;
        const VIEW_ZOOM_PER_S = 0.9;        // zoom speed (distance changes by about e^this per second)
        const VIEW_MIN_ELEV_DEG = 5, VIEW_MAX_ELEV_DEG = 89;   // lowest (side-on) and highest (overhead) view angles
        const VIEW_MIN_RANGE_M = 120, VIEW_MAX_RANGE_M = 90000;
        const VIEW_TAP_MS = 220;            // a quick click moves as if held this long
        const VIEW_MAX_STEP_S = 0.25;       // most movement applied in one frame (keeps slow computers smooth)

        const VB_SVG = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
        const VB_ROTATE = '<path d="M5 12a7 7 0 1 0 2.2-5.1"/><path d="M4.5 3.5v4.4h4.4"/>';
        const VIEW_BUTTONS = [
            { label: 'Move', id: 'move', buttons: [
                ['moveLeft',    'Move left',    VB_SVG('<path d="M19 12H5M11 6l-6 6 6 6"/>')],
                ['moveForward', 'Move forward', VB_SVG('<path d="M12 19V5M6 11l6-6 6 6"/>')],
                ['moveBack',    'Move back',    VB_SVG('<path d="M12 5v14M6 13l6 6 6-6"/>')],
                ['moveRight',   'Move right',   VB_SVG('<path d="M5 12h14M13 6l6 6-6 6"/>')] ] },
            { label: 'Rotate', buttons: [
                ['turnCcw', 'Rotate the view counterclockwise', VB_SVG(VB_ROTATE)],
                ['turnCw',  'Rotate the view clockwise',        VB_SVG(`<g transform="translate(24 0) scale(-1 1)">${VB_ROTATE}</g>`)] ] },
            { label: 'View angle', buttons: [
                ['tiltHigher', 'Look from higher up (more overhead)', 'Higher', true],
                ['tiltLower',  'Look from lower down (more side-on)', 'Lower', true] ] },
            { label: 'Zoom', buttons: [
                ['zoomIn',  'Zoom in',  VB_SVG('<path d="M12 5v14M5 12h14"/>')],
                ['zoomOut', 'Zoom out', VB_SVG('<path d="M5 12h14"/>')] ] },
            { label: 'Reset', buttons: [
                ['reset', 'Back to the airport, showing all aircraft', VB_SVG('<path d="M4 11.5l8-7 8 7"/><path d="M6.5 9.5V19h11V9.5"/>')] ] }
        ];

        let viewAction = null, viewHeld = false, viewStartMs = 0, viewReleaseMs = 0, viewAppliedMs = 0, viewPivot = null, viewBtnEl = null;
        let viewBarFocus;   // which aircraft the bar is currently showing as followed

        // Ground point in the middle of the view
        function viewCenterPoint() {
            const cam = viewer.camera, canvas = viewer.canvas;
            const mid = new Cesium.Cartesian2(canvas.clientWidth / 2, canvas.clientHeight / 2);
            const ray = cam.getPickRay(mid);
            let p = ray ? viewer.scene.globe.pick(ray, viewer.scene) : undefined;
            if (!p) p = cam.pickEllipsoid(mid);
            if (!p || Cesium.Cartesian3.distance(p, cam.positionWC) > VIEW_MAX_RANGE_M) {
                // looking at the horizon or sky: use a point ahead of the camera instead
                const ahead = Math.max(500, cam.positionCartographic.height * 2);
                p = Cesium.Cartesian3.add(cam.positionWC, Cesium.Cartesian3.multiplyByScalar(cam.directionWC, ahead, new Cesium.Cartesian3()), new Cesium.Cartesian3());
            }
            return p;
        }

        function applyViewAction(action, dt) {
            const C3 = Cesium.Cartesian3, cam = viewer.camera;
            const followed = viewer.trackedEntity;
            const followedPos = followed && followed.position && followed.position.getValue(viewer.clock.currentTime);

            if (action.startsWith('move')) {
                if (followed) return;
                const up = Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(cam.positionWC, new C3());
                const flat = (v) => C3.subtract(v, C3.multiplyByScalar(up, C3.dot(v, up), new C3()), new C3());
                let fwd = flat(cam.directionWC);
                if (C3.magnitude(fwd) < 0.05) fwd = flat(cam.upWC);   // looking straight down: "forward" is the top of the screen
                C3.normalize(fwd, fwd);
                const right = C3.cross(fwd, up, new C3());
                const range = Math.min(C3.distance(cam.positionWC, viewCenterPoint()), VIEW_MAX_RANGE_M);
                const step = Math.max(range, 200) * VIEW_MOVE_PER_S * dt;
                const dir = { moveForward: fwd, moveBack: C3.negate(fwd, new C3()), moveRight: right, moveLeft: C3.negate(right, new C3()) }[action];
                cam.move(dir, step);
                return;
            }

            const pivot = followedPos || viewPivot || (viewPivot = viewCenterPoint());

            if (action.startsWith('zoom')) {
                const range = followed ? C3.magnitude(cam.position) : C3.distance(cam.positionWC, pivot);
                const k = Math.exp((action === 'zoomIn' ? -1 : 1) * VIEW_ZOOM_PER_S * dt);
                const target = Math.min(VIEW_MAX_RANGE_M, Math.max(VIEW_MIN_RANGE_M, range * k));
                if (followed) {
                    C3.multiplyByScalar(cam.position, target / range, cam.position);   // closer to / further from the aircraft
                } else {
                    const toPivot = C3.normalize(C3.subtract(pivot, cam.positionWC, new C3()), new C3());
                    let step = range - target;
                    if (step > 0) {
                        // stop at the same minimum height above the ground that the mouse zoom has
                        const carto = cam.positionCartographic;
                        const above = carto.height - (viewer.scene.globe.getHeight(carto) || 0);
                        const floor = viewer.scene.screenSpaceCameraController.minimumZoomDistance + 2;
                        const drop = -C3.dot(toPivot, Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(cam.positionWC, new C3()));   // height lost per metre moved
                        if (drop > 1e-3) step = Math.min(step, Math.max(0, (above - floor) / drop));
                    }
                    cam.move(toPivot, step);
                }
                return;
            }

            // Rotate / view angle: orbit around the pivot. While following, the camera is already in
            // the aircraft's frame; otherwise work in a frame centred on the pivot, then release it.
            if (!followed) cam.lookAtTransform(Cesium.Transforms.eastNorthUpToFixedFrame(pivot));
            const upW = Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(pivot, new C3());
            const up = C3.normalize(Cesium.Matrix4.multiplyByPointAsVector(cam.inverseTransform, upW, new C3()), new C3());
            if (action === 'turnCcw' || action === 'turnCw') {
                cam.rotate(up, (action === 'turnCcw' ? 1 : -1) * Cesium.Math.toRadians(VIEW_TURN_DEG_PER_S) * dt);
            } else {
                const fromPivot = C3.normalize(cam.position, new C3());
                const elev = Math.asin(Math.max(-1, Math.min(1, C3.dot(fromPivot, up))));
                const want = elev + (action === 'tiltHigher' ? 1 : -1) * Cesium.Math.toRadians(VIEW_TILT_DEG_PER_S) * dt;
                const target = Math.min(Cesium.Math.toRadians(VIEW_MAX_ELEV_DEG), Math.max(Cesium.Math.toRadians(VIEW_MIN_ELEV_DEG), want));
                if ((action === 'tiltHigher') === (target > elev)) cam.rotate(cam.right, target - elev);
            }
            if (!followed) cam.lookAtTransform(Cesium.Matrix4.IDENTITY);
        }

        function initViewButtons() {
            const bar = document.getElementById('a3d-viewbar');
            bar.innerHTML = '<button type="button" id="vb-stop" class="vb-btn vb-wide" title="Stop following this aircraft and show all aircraft">Stop following</button>' +
                VIEW_BUTTONS.map(g =>
                    `<div class="vb-group"${g.id ? ` id="vb-${g.id}"` : ''}><div class="vb-row">` +
                    g.buttons.map(([act, tip, inner, wide]) =>
                        `<button type="button" class="vb-btn${wide ? ' vb-wide' : ''}" data-act="${act}" title="${tip}" aria-label="${tip}">${inner}</button>`).join('') +
                    `</div><div class="vb-label">${g.label}</div></div>`).join('');

            const start = (btn) => {
                if (btn.disabled) return;
                stop();
                viewAction = btn.dataset.act;
                viewHeld = true;
                viewStartMs = viewAppliedMs = performance.now();
                viewPivot = null;
                viewBtnEl = btn;
                btn.classList.add('vb-on');
            };
            const stop = () => {
                if (viewHeld) viewReleaseMs = performance.now();
                viewHeld = false;
                if (viewBtnEl) viewBtnEl.classList.remove('vb-on');
                viewBtnEl = null;
            };
            const isPressKey = (e) => e.key === 'Enter' || e.key === ' ';

            bar.querySelectorAll('[data-act]').forEach(btn => {
                if (btn.dataset.act === 'reset') {
                    btn.addEventListener('click', () => viewer.homeButton.viewModel.command());
                    return;
                }
                btn.addEventListener('pointerdown', e => {
                    if (e.button !== undefined && e.button !== 0) return;
                    e.preventDefault();
                    try { btn.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
                    start(btn);
                });
                for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture', 'blur']) btn.addEventListener(ev, stop);
                btn.addEventListener('keydown', e => { if (isPressKey(e)) { e.preventDefault(); if (!e.repeat) start(btn); } });
                btn.addEventListener('keyup', e => { if (isPressKey(e)) stop(); });
                btn.addEventListener('contextmenu', e => e.preventDefault());
            });
            window.addEventListener('blur', stop);
            // show "Stop following" and switch off Move while an aircraft is followed
            const syncBar = () => {
                if (focusHex === viewBarFocus) return;
                viewBarFocus = focusHex;
                document.getElementById('vb-stop').style.display = focusHex ? 'flex' : 'none';
                bar.querySelectorAll('#vb-move .vb-btn').forEach(b => {
                    b.disabled = !!focusHex;
                    b.title = focusHex ? 'Not available while following an aircraft. Press "Stop following" first.' : b.getAttribute('aria-label');
                });
                if (focusHex && viewAction && viewAction.startsWith('move')) { stop(); viewAction = null; }
            };
            document.getElementById('vb-stop').addEventListener('click', () => { setFocus(null); syncBar(); });
            document.getElementById('track-select').addEventListener('change', syncBar);

            // Movement is based on how long the button was held (at least VIEW_TAP_MS), not on
            // how many frames were drawn, so it behaves the same on fast and slow computers.
            viewer.scene.preRender.addEventListener(() => {
                syncBar();
                if (!viewAction) return;
                const now = performance.now();
                const endMs = viewHeld ? now : Math.max(viewReleaseMs, viewStartMs + VIEW_TAP_MS);
                const upTo = Math.min(now, endMs);
                const dt = Math.min(VIEW_MAX_STEP_S, (upTo - viewAppliedMs) / 1000);
                viewAppliedMs = upTo;
                const action = viewAction;
                if (!viewHeld && now >= endMs) viewAction = null;
                if (dt > 0) applyViewAction(action, dt);
            });
        }

        // ── Feed polling ────────────────────────────────────────────────
        async function poll() {
            if (document.visibilityState === 'hidden') return;   // don't fetch while the tab is in the background
            if (backfillCount > 0) return;   // [RECENT PATHS] wait while history is being added
            const gen = pollGen;
            let data;
            try {
                const res = await fetch(`${cfg.feedUrl}?_=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                data = await res.json();
            } catch (err) {
                console.error('[3D] feed error:', err);
                setStatus('Live feed unavailable — retrying', true);
                return;
            }
            if (gen !== pollGen) return;   // airport switched while this request was in flight

            // [GAP FIX] live updates stopped for a while: rebuild trails from history instead
            if (lastFeedNow != null && !skipGapCheck && data.now - lastFeedNow > GAP_BREAK_S) {
                lastFeedNow = data.now;
                lastFeedWall = Date.now();
                refillAfterGap();
                return;
            }
            skipGapCheck = false;

            syncClock(data.now);
            lastFeedNow = data.now;   // [RECENT PATHS]
            lastFeedWall = Date.now();   // [RECENT PATHS]
            const wallNow = Date.now();

            for (const ac of data.aircraft || []) {
                if (!ac.hex || ac.lat == null || ac.lon == null) continue;
                if (typeof ac.seen_pos === 'number' && ac.seen_pos > STALE_POS_S) continue;
                if (distanceKm(cfg.lat, cfg.lon, ac.lat, ac.lon) > cfg.radiusKm) continue;
                const alt = altitudes(ac, cfg);
                if (!alt) continue;
                if (typeof ac.alt_geom === 'number' && typeof ac.alt_baro === 'number') geomOffsets[ac.hex] = ac.alt_geom - ac.alt_baro;   // [RECENT PATHS]

                let tr = tracks[ac.hex];
                if (!tr) {
                    // Like the track logger: only start following aircraft at/below the ceiling;
                    // once followed, keep following through a climb-out.
                    if (!alt.onGround && (alt.mslFt - cfg.fieldElevFt) > cfg.ceilingAglFt) continue;
                    tr = tracks[ac.hex] = createTrack(ac.hex);
                }
                tr.lastSeenWall = wallNow;

                const sec = data.now - (ac.seen_pos || 0);   // actual position time from the receiver
                if (!tr.last || sec > tr.last.sec) {
                    const heightM = alt.haeFt * FT + (alt.onGround ? GROUND_LIFT_M : 0);   // [TERRAIN] true height
                    addPoint(tr, sec, Cesium.Cartesian3.fromDegrees(ac.lon, ac.lat, heightM), bandIndex(alt.mslFt));
                }
                updateInfo(tr, ac, alt);
                trailNoteReport(tr, ac);   // [SMOOTH PATH] reporting step, and the note in the info panel
            }

            const cutoff = data.now - TRAIL_SECONDS;
            for (const hex in tracks) {
                const tr = tracks[hex];
                if (wallNow - tr.lastSeenWall > REMOVE_AFTER_S * 1000) removeTrack(tr);
                else trimTrack(tr, cutoff);
            }

            const n = Object.keys(tracks).length;
            setStatus(`Live · ${n} aircraft`);
            refreshTrackList();   // [TRACK FOCUS]
        }

        async function pollLoop() {
            await poll();
            pollTimer = setTimeout(pollLoop, POLL_MS);
        }

        function startAirport(code) {
            const c = AIRPORT_3D[code];
            if (!c) { setStatus('3D view is not configured for this airport yet.', true); return; }
            cfg = c;
            pollGen++;
            clearTimeout(pollTimer);
            clearTracks();
            document.getElementById('a3d-title').textContent = `3D Airspace — ${c.name}`;
            setStatus('Connecting…');
            frameAirport(c);
            backfill(estimateFeedNow() - TRAIL_SECONDS, true);   // [RECENT PATHS] start with recent history
            pollLoop();
        }

        // ════════════════════════════════════════════════════════════════
        // [HISTORY] Recorded flights from the track logger (tracks_pou / tracks_owd).
        //  • The Live / History switch in the header turns this on. Live updates wait
        //    while History is showing and restart when you switch back.
        //  • "Show flights" loads every recorded visit that overlaps the chosen date,
        //    start time and length. "Find on this date" loads one tail number's
        //    visits for the whole day.
        //  • The timeline (above the view buttons) replays the window: Replay, Play /
        //    Pause, a slider, speed, and "Show full paths" (the whole window at once).
        //  • Picking a flight from the Track list, or clicking its path, shows only
        //    that flight. The camera follows it while it is on screen.
        //  • Links: 3Dairspace.html?airport=pou&track=<document id>   (opens at the start of that track)
        //           3Dairspace.html?airport=pou&date=2026-10-02&time=15:30&window=60
        //           3Dairspace.html?airport=pou&date=2026-10-02&tail=N12KB
        //  Dates and times are the airport's local time. Altitude uses the recorded
        //  GNSS height ("ag") when a track has it, otherwise pressure altitude.
        // ════════════════════════════════════════════════════════════════
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const HISTORY_SOURCES = {
            pou: { collection: 'tracks_pou', tz: 'America/New_York' },
            owd: { collection: 'tracks_owd', tz: 'America/New_York' }
        };
        const HISTORY_LOOKBACK_MIN = 180;   // also fetch visits that started up to this long before the window (they may still be flying in it)
        const HISTORY_MAX_FLIGHTS = 150;    // most visits drawn at once
        const HISTORY_KEPT_DAYS = 30;       // how long the logger keeps tracks (TRACK_RETENTION_DAYS); only used in messages
        const HISTORY_SPEEDS = [1, 5, 10, 30, 60];
        const HISTORY_DEFAULT_SPEED = 10;

        // [FIRST OPEN] A link to one track (?airport=…&track=…): ask the database for that track's record
        // straight away, alongside sign-in, instead of after the map has started. The map's own start-up
        // loading was holding this read up on a first open, so the page sat on "History · loading…".
        const histEarly = (() => {
            const qp = new URLSearchParams(location.search), id = qp.get('track');
            const src = HISTORY_SOURCES[(qp.get('airport') || '').toLowerCase()];
            if (!id || !src) return null;
            const promise = getDoc(doc(db, src.collection, id));
            promise.catch(() => {});   // if it fails (for example, not signed in yet) the normal read below is used
            return { id, collection: src.collection, promise };
        })();

        let historyOn = false, historyReady = false;
        let histWin = null;                 // { startMs, endMs } of what is loaded
        let histPlaying = false, histSpeed = HISTORY_DEFAULT_SPEED, histDragging = false;
        let histLoadGen = 0, histFocusSeen = null;

        const histEl = (id) => document.getElementById(id);
        const histSource = () => HISTORY_SOURCES[currentAirportCode()];
        function currentAirportCode() { return Object.keys(AIRPORT_3D).find(k => AIRPORT_3D[k] === cfg) || null; }

        // ── Airport-local dates and times ──
        function tzParts(ms, tz) {
            const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(new Date(ms));
            const g = (t) => Number(parts.find(p => p.type === t).value);
            return { y: g('year'), mo: g('month'), d: g('day'), h: g('hour') % 24, mi: g('minute'), s: g('second') };
        }
        // Airport wall-clock time -> UTC milliseconds
        function zonedToUtcMs(y, mo, d, h, mi, tz) {
            const wall = Date.UTC(y, mo - 1, d, h, mi);
            let guess = wall;
            for (let i = 0; i < 3; i++) {
                const p = tzParts(guess, tz);
                guess = wall - (Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi) - Math.floor(guess / 60000) * 60000);
            }
            return guess;
        }
        const pad2 = (n) => String(n).padStart(2, '0');
        const histClock = (ms, withSec) => new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: histSource().tz, hour: 'numeric', minute: '2-digit' }, withSec ? { second: '2-digit' } : {})).format(new Date(ms));
        const histDay = (ms) => new Intl.DateTimeFormat('en-US', { timeZone: histSource().tz, month: 'short', day: 'numeric' }).format(new Date(ms));
        // "2026-10-02" or "10/02/2026" -> { y, mo, d }
        function parseDateText(s) {
            let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec((s || '').trim());
            if (m) return { y: +m[1], mo: +m[2], d: +m[3] };
            m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((s || '').trim());
            return m ? { y: +m[3], mo: +m[1], d: +m[2] } : null;
        }
        // "15:30", "3:30 PM" or "3:30:00 PM" -> { h, mi }
        function parseTimeText(s) {
            const m = /^(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?$/.exec((s || '').trim());
            if (!m) return null;
            let h = +m[1];
            if (m[3]) h = (h % 12) + (/p/i.test(m[3]) ? 12 : 0);
            return (h < 24 && +m[2] < 60) ? { h, mi: +m[2] } : null;
        }

        // [FIRST OPEN] Cesium rounds down when its clock is turned back into a date, so the plain reading can be
        // 1 ms early. That made a track that was opened at its start look as if it had not started yet. This gives the exact millisecond.
        const histJdTmp = new Cesium.JulianDate();
        function histMsOf(jd) {
            const ms = Cesium.JulianDate.toDate(jd).getTime();
            return Math.abs(Cesium.JulianDate.secondsDifference(jd, Cesium.JulianDate.fromDate(new Date(ms + 1), histJdTmp))) < 0.0004 ? ms + 1 : ms;
        }
        const histClockMs = () => histMsOf(viewer.clock.currentTime);
        function histSetTime(ms) {
            if (!histWin) return;
            const t = Math.min(histWin.endMs, Math.max(histWin.startMs, ms));
            viewer.clock.currentTime = Cesium.JulianDate.fromDate(new Date(t));
        }
        function histPlay(on) {
            histPlaying = !!on && !!histWin;
            viewer.clock.multiplier = histSpeed;
            viewer.clock.shouldAnimate = histPlaying;
            histEl('tl-play').textContent = histPlaying ? 'Pause' : 'Play';
        }

        // ── One recorded visit -> one track (same models, trails and info panel as live) ──
        function buildHistoryTrack(id, d) {
            const startMs = Date.parse(d.start || d.timestamp);
            const pts = Array.isArray(d.track) ? d.track : [];
            if (!isFinite(startMs) || pts.length < 2) return null;
            const hex = String(d.hex || '').toLowerCase();
            const stored = String(d.registration || '').trim();
            const storedOk = !!stored && stored !== 'Unknown';
            // type / icon: your FAA registry by transponder address; helicopters from the logger's own flag
            const info = { hex, flight: storedOk ? stored : '', category: d.aircraftType === 'Rotorcraft' ? 'A7' : undefined };
            enrichAircraft(info);
            const reg = storedOk ? stored : (info.r || (hex ? hex.toUpperCase() : 'Unknown'));   // name shown on labels and in the list

            const tr = tracks[id] = createTrack(id);
            const rows = [];
            let gnss = 0, baro = 0, lowest = Infinity;
            for (let i = 0; i < pts.length; i++) {
                const p = pts[i];
                if (num(p.lat) == null || num(p.lon) == null || num(p.alt) == null) continue;
                const sec = startMs / 1000 + (num(p.t) ?? i * 2);
                if (tr.last && sec <= tr.last.sec) continue;
                let alt, src;
                if (num(p.ag) != null) { alt = { onGround: false, haeFt: p.ag, mslFt: p.ag - cfg.geoidFt }; src = 'g'; gnss++; }
                else if (p.alt === cfg.fieldElevFt) { alt = { onGround: true, mslFt: cfg.fieldElevFt, haeFt: cfg.fieldElevFt + cfg.geoidFt }; src = 'x'; }   // the logger stores field elevation for aircraft on the ground
                else { alt = { onGround: false, mslFt: p.alt, haeFt: p.alt + cfg.geoidFt }; src = 'b'; baro++; }
                if (!alt.onGround) lowest = Math.min(lowest, alt.mslFt);

                const heightM = alt.haeFt * FT + (alt.onGround ? GROUND_LIFT_M : 0);
                addPoint(tr, sec, Cesium.Cartesian3.fromDegrees(p.lon, p.lat, heightM), bandIndex(alt.mslFt));

                // climb / descent rate from the recorded altitudes a few points back (for the model's nose angle)
                const back = rows[rows.length - 3];
                const rate = (back && back.src === src && src !== 'x' && sec > back.sec) ? (alt.mslFt - back.alt.mslFt) / (sec - back.sec) * 60 : undefined;
                setAttitude(tr, {
